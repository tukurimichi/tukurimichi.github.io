  +`<div class="row" style="justify-content:center"><button class="big" id="phSave">${L('ほぞん','Save')}</button><button id="phClose">${L('とじる','Close')}</button></div>`;
 $('miniInfo').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{pick=b.dataset.st;$('miniInfo').querySelectorAll('[data-st]').forEach(c=>c.style.boxShadow=c===b?'inset 0 0 0 2px #ff9a76':'')});
 cv.onpointerdown=e=>{if(!pick)return;const r=cv.getBoundingClientRect();placed.push({e:pick,x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height,s:90+Math.random()*40});draw();blip(1200,0.05)};
 const close=()=>{$('mini').style.display='none';miniOn=false;cv.onpointerdown=null;cv.width=400;cv.height=460;paintHelp()};
 $('phClose').onclick=close;
 $('phSave').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`omise_day${S.day}.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)});
  // アルバムにも 小さく のこす（6まいまで）
  try{const sm=document.createElement('canvas');sm.width=360;sm.height=Math.round(360*cv.height/cv.width);sm.getContext('2d').drawImage(cv,0,0,sm.width,sm.height);(S.album=S.album||[]).push(sm.toDataURL('image/jpeg',0.7));if(S.album.length>6)S.album.shift();save()}catch(e){}
  blip(1800,0.05);toast(L('📷 ほぞんしたよ。ずかんの アルバムにも はいったよ','📷 Saved — also added to your album'));close()}}
function oldTakePhoto(){hint0=$('hint').style.display;composer.render();const src=renderer.domElement;
 const W=1080,H=Math.round(W*src.height/src.width)+180,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 x.fillStyle='#fff8ec';x.fillRect(0,0,W,H);x.drawImage(src,40,40,W-80,(W-80)*src.height/src.width);
 x.fillStyle='#5a4a3c';x.font='bold 48px "Hiragino Maru Gothic ProN",sans-serif';x.textAlign='left';
 x.fillText(shopName(),56,H-90);x.font='30px "Hiragino Maru Gothic ProN",sans-serif';
 const d=new Date();x.fillText(L(`${S.day}日目・⭐${S.star}・ファン${S.fans}人・${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,`Day ${S.day}・⭐${S.star}・${S.fans} fans・${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`),56,H-40);
 x.textAlign='right';x.fillStyle='#a39486';x.font='26px sans-serif';x.fillText('tukurimichi.com',W-56,H-40);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`omise_day${S.day}.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)});
 const fl=document.createElement('div');fl.style.cssText='position:fixed;inset:0;background:#fff;opacity:.9;z-index:30;transition:opacity .5s;pointer-events:none';document.body.appendChild(fl);setTimeout(()=>fl.style.opacity=0,30);setTimeout(()=>fl.remove(),600);
 blip(1800,0.05);toast(L('📷 おみせの しゃしんを ほぞんしたよ','📷 Photo saved'))}
let hint0;
function toast(s,ms=2400){const t=$('toast');t.innerHTML=s;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function hint(){if(letters.length)return L('💌 おてがみが おちてるよ！ タッチして ひらいてね','💌 Someone left a letter! Tap it to open.');if(mode==='place')return L(`🪵 オレンジの 丸に たなを おけるよ（${yen(SHELF_COST(S.shelves.length))}）`,`🪵 Tap an orange circle to place a shelf (${yen(SHELF_COST(S.shelves.length))})`);
 const empty=S.shelves.find(s=>s.stock===0);if(empty)return L(`📦 ${nm(ITEMS[empty.item])}の たなが からっぽ！ たなを タッチして しいれよう`,`📦 The ${nm(ITEMS[empty.item])} shelf is empty. Tap it to restock.`);
 if(S.day===1)return L(`🏪 あなたは 小さな お店の てんちょう。たなを タッチすると、しなものを かったり、ねだんを きめたり できるよ。夜に お店の やちん ${yen(rentNow())}を はらうよ`,`🏪 You run a tiny shop. Tap a shelf to restock and set prices. Rent of ${yen(rentNow())} is due each night.`);
 return S.msgs||L('お客さんの ふきだしは ほしい もの。ない ものが 多かったら、あたらしい たなを おいてみよう','Speech bubbles show what customers want. If you keep missing items, add a shelf.')}
const KID=()=>!S.detail;
function hud(){document.body.classList.toggle('kid',KID());$('detBtn').textContent=KID()?'👀':'📖';const fb=$('forestBtn');if(fb)fb.textContent='🌲 '+L('森へ','Forest');$('money').textContent=yen(S.money);$('star').textContent=S.star+L(`（ファン ${S.fans}人）`,` (${S.fans} fans)`);
 const hr=8+Math.floor(S.t/DAY_SEC*12);$('day').textContent=L(`${S.day}日目 ${hr}:00`,`Day ${S.day} ${hr}:00`);$('langBtn').textContent=lang==='ja'?'EN':'日本語';const rqs=(S.reqs||[]).filter(q=>!q.done&&q.day>=S.day);$('goalPill').textContent=(S.weather?WEATHER[S.weather].e+' ':'')+(rqs.length?rqs.map(q=>`📝${q.name} ${q.day===S.day?L('きょう','today'):L('あした','tmrw')} ${ITEMS[q.item].e}×${q.n}`).join(' ')+'　':'')+(S.goal?(KID()?`${ITEMS[S.pop]?ITEMS[S.pop].e+'⬆️':''} 🎯${goalIcon()} ${goalProg()}`:`${ITEMS[S.pop]?ITEMS[S.pop].e:''}${L('にんき','hot')}・🎯 ${goalText()} ${goalProg()}`):'');$('speed').textContent=['⏸','▶','⏩'][ui.speed];$('hint').textContent=hint();paintHelp()}

// ================= ループ =================
if(!S.goal){S.today.fans0=S.fans;newDay()}
if(!S.weather)S.weather=pickWeather();applyWeather();
buildShop();rebuildShelves();paintDock();hud();if(!S.named)setTimeout(()=>openName(true),600);if(ui.sel!=null)openShelf();
const clock=new THREE.Clock();let spawnT=0,hudT=0,walkT=2,funnyT=60+Math.random()*60;placePet();
renderer.setAnimationLoop(()=>{const raw=Math.min(0.05,clock.getDelta());if(FR){FR.tick(raw);return}const dt=raw*[0,1,2.5][ui.speed];
 if(dt){S.t+=dt;spawnT-=dt;
  // お客さんの来やすさ：評判とファンで増える。夜（最後の1割）は来ない
  const night=S.t>DAY_SEC*0.9;if(!night&&spawnT<=0){spawn();spawnT=Math.max(1.8,7-S.star*0.8-S.fans*0.02-styleScore()*0.08)*(0.6+rnd()*0.8)*({rain:1.25,snow:1.4}[S.weather]||1)*(petAwake()?1-S.pet.love/400:1)/((S.ev&&S.ev.busy)||1)}
  const rq=dueReq();if(rq&&S.t>DAY_SEC*0.3&&S.t<DAY_SEC*0.8&&guests.length<8)spawn(rq);
  walkT-=dt;if(!night&&walkT<=0){spawnWalker();walkT=3+rnd()*4}
  funnyT-=dt;if(!night&&S.t>DAY_SEC*0.2&&funnyT<=0){funnyEvent();funnyT=90+rnd()*120}
  if(S.t>=DAY_SEC&&!guests.length)endDay()}
 walkerTick(dt);
 for(let i=funny.length-1;i>=0;i--){const f=funny[i];f.t-=dt;f.o.rotation.y=0.4+Math.sin(performance.now()/900)*0.3;if(f.t<=0){scene.remove(f.o);funny.splice(i,1)}}
 if(petObj){const aw=petAwake();petObj.userData.zzz.visible=!aw;petObj.position.y=aw?Math.abs(Math.sin(performance.now()/300))*0.05:0;const hd=petObj.userData.P?petObj.userData.P.head:petObj.children.find(c=>c===petObj.userData.head)||petObj.userData.head;if(hd&&aw)hd.rotation.z=Math.sin(performance.now()/500)*0.2;if(petObj.userData.tail)petObj.userData.tail.rotation.z=Math.sin(performance.now()/150)*0.6;if(petObj.userData.P&&petObj.userData.P.tail)petObj.userData.P.tail.rotation.z=Math.sin(performance.now()/260)*0.4}
 guestTick(dt);
 weatherTick(dt);
 for(const e of letters){e.position.y=0.05+Math.abs(Math.sin(performance.now()/250))*0.12;e.rotation.y+=raw*1.5}
 for(let i=sparks.length-1;i>=0;i--){const k=sparks[i];k.t+=raw;k.m.position.addScaledVector(k.m.userData.v,raw);k.m.userData.v.y-=raw*3;k.m.rotation.y+=raw*6;k.m.material.opacity=1-k.t;if(k.t>1){scene.remove(k.m);sparks.splice(i,1)}}
 for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.t+=raw;c.s.position.y=1.6+c.t*1.2;c.s.material.opacity=1-c.t;if(c.t>1){scene.remove(c.s);coins.splice(i,1)}}
 // 夕方は明かりがつく
 const ph=S.t/DAY_SEC;lamp.intensity=ph>0.7?(ph-0.7)*12:0;sun.intensity=({sunny:2.1,cloudy:1.5,rain:1.2,snow:1.6}[S.weather]||2.1)-(ph>0.7?(ph-0.7)*3:0);
 hudT-=raw;if(hudT<=0){hudT=0.5;hud()}
 ctl.update();composer.render()});
setInterval(save,3000);addEventListener('pagehide',save);
</script></body></html>
