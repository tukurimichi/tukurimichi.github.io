// ---- low-poly icon/mascot builders (site palette: red/cream/darkBrown/orange) ----
function buildRobotHead(scale){
  scale=scale||1;
  var g=new THREE.Group();
  var shell=new THREE.Mesh(new THREE.BoxGeometry(20*scale,18*scale,14*scale),new THREE.MeshStandardMaterial({color:0xF0862E}));
  g.add(shell);
  var face=new THREE.Mesh(new THREE.BoxGeometry(15*scale,13*scale,3*scale),new THREE.MeshStandardMaterial({color:0xF7EEE1}));
  face.position.set(0,0,8*scale);
  g.add(face);
  var screen=new THREE.Mesh(new THREE.BoxGeometry(12*scale,7*scale,1.5*scale),new THREE.MeshStandardMaterial({color:0x3A2A22}));
  screen.position.set(0,-1*scale,10*scale);
  g.add(screen);
  var eyeGeo=new THREE.SphereGeometry(1.3*scale,8,6);
  var eyeMat=new THREE.MeshStandardMaterial({color:0xFFB74D});
  var eyeL=new THREE.Mesh(eyeGeo,eyeMat);eyeL.position.set(-3*scale,-1*scale,10.9*scale);g.add(eyeL);
  var eyeR=new THREE.Mesh(eyeGeo,eyeMat);eyeR.position.set(3*scale,-1*scale,10.9*scale);g.add(eyeR);
  return g;
}
function buildMascotBody(scale){
  scale=scale||1;
  var g=new THREE.Group();
  var orangeMat=new THREE.MeshStandardMaterial({color:0xF0862E});
  var creamMat=new THREE.MeshStandardMaterial({color:0xF7EEE1});
  var darkMat=new THREE.MeshStandardMaterial({color:0x3A2A22});
  var legGeo=new THREE.BoxGeometry(7*scale,14*scale,7*scale);
  var legL=new THREE.Group();legL.position.set(-5*scale,-17*scale,0);
  var legLMesh=new THREE.Mesh(legGeo,orangeMat);legLMesh.position.set(0,-7*scale,0);
  legL.add(legLMesh);
  var legR=new THREE.Group();legR.position.set(5*scale,-17*scale,0);
  var legRMesh=new THREE.Mesh(legGeo,orangeMat);legRMesh.position.set(0,-7*scale,0);
  legR.add(legRMesh);
  g.add(legL,legR);
  var torso=new THREE.Mesh(new THREE.BoxGeometry(20*scale,18*scale,12*scale),creamMat);
  torso.position.set(0,-6*scale,0);
  g.add(torso);
  var chest=new THREE.Mesh(new THREE.BoxGeometry(12*scale,10*scale,2*scale),orangeMat);
  chest.position.set(0,-4*scale,7*scale);
  g.add(chest);
  var armGeo=new THREE.BoxGeometry(6*scale,14*scale,6*scale);
  var shoulderY=2*scale;
  var leftArm=new THREE.Group();leftArm.position.set(-13*scale,shoulderY,0);
  var leftArmMesh=new THREE.Mesh(armGeo,darkMat);leftArmMesh.position.set(0,-7*scale,0);
  leftArm.add(leftArmMesh);
  var rightArm=new THREE.Group();rightArm.position.set(13*scale,shoulderY,0);
  var rightArmMesh=new THREE.Mesh(armGeo,darkMat);rightArmMesh.position.set(0,-7*scale,0);
  rightArm.add(rightArmMesh);
  g.add(leftArm,rightArm);
  var headGroup=buildRobotHead(scale*1.1);
  headGroup.position.set(0,14*scale,0);
  g.add(headGroup);
  return {group:g,leftArm:leftArm,rightArm:rightArm,head:headGroup,leftLeg:legL,rightLeg:legR};
}
function makeShadowTexture(){

  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

function buildDeskGear(){

  function hitTest(clientX,clientY){
    var r=canvas.getBoundingClientRect();
    ndc.x=((clientX-r.left)/r.width)*2-1;
    ndc.y=-((clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(ndc,camera);
    var hits=raycaster.intersectObjects(raycastTargets,true);
    if(hits.length===0)return null;
    var hitKey=hits[0].object.userData.rootKey;
    for(var i=0;i<items.length;i++){if(items[i].cfg.key===hitKey)return items[i];}
    return null;
  }
  function hitTestMascot(clientX,clientY){
    var r=canvas.getBoundingClientRect();
    ndc.x=((clientX-r.left)/r.width)*2-1;
    ndc.y=-((clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(ndc,camera);
    return raycaster.intersectObject(mascot.group,true).length>0;
  }

  var hoveredKey=null;
  function setHover(item){
    var k=item?item.cfg.key:null;
    if(k===hoveredKey)return;
    hoveredKey=k;
    items.forEach(function(it){
      var on=it.cfg.key===k;
      it.hoverTarget=on?1:0;
      it.label.classList.toggle("hover",on);
    });
  }
  function goTo(item){
    item.bounceT=1;
    setTimeout(function(){
      if(item.cfg.action==="idea"){triggerIdea();}
      else if(item.cfg.href){location.href=item.cfg.href;}
    },300);
  }

  var dragging=false,committed=false,startX=0,startY=0,lastX=0,angVel=0;
  var ROT_LIMIT=25*Math.PI/180;

  canvas.addEventListener("pointerdown",function(e){
    dragging=true;committed=false;startX=e.clientX;startY=e.clientY;lastX=e.clientX;angVel=0;
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  });
  canvas.addEventListener("pointermove",function(e){
    if(dragging){
      var dx=e.clientX-startX,dy=e.clientY-startY;
      if(!committed){
        if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.15){committed=true;}
        else if(Math.abs(dy)>10){return;}
      }
      if(committed){
        var delta=e.clientX-lastX;
        lastX=e.clientX;
        deskGroup.rotation.y=Math.max(-ROT_LIMIT,Math.min(ROT_LIMIT,deskGroup.rotation.y+delta*0.006));
        angVel=delta*0.006;
      }
    }else{
      setHover(hitTest(e.clientX,e.clientY));
    }
  });
  function endDrag(e){
    if(dragging&&!committed){
      var hit=hitTest(e.clientX,e.clientY);
      if(hit){goTo(hit);}
      else if(hitTestMascot(e.clientX,e.clientY)){
        waveState={t0:Date.now()};
      }
    }
    dragging=false;
  }
  canvas.addEventListener("pointerup",endDrag);
  canvas.addEventListener("pointercancel",function(){dragging=false;});
  canvas.addEventListener("pointerleave",function(){if(!dragging)setHover(null);});

  function layout(){
    W=wrap.clientWidth;H=wrap.clientHeight;
    if(W<10||H<10)return;
    renderer.setSize(W,H,false);
    camera.aspect=W/H;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize",layout);
  layout();

  var v3=new THREE.Vector3();
  function updateLabels(){
    items.forEach(function(item){
      item.group.getWorldPosition(v3);
      v3.z+=item.cfg.labelFront!==undefined?item.cfg.labelFront:24;
      v3.y-=4;
      v3.project(camera);
      var x=(v3.x*0.5+0.5)*W;
      var y=(-v3.y*0.5+0.5)*H;
      item.label.style.left=x+"px";
      item.label.style.top=y+"px";
      item.label.style.display=(v3.z<1)?"block":"none";
    });
  }

  setTimeout(function(){
    items.forEach(function(item,i){
      setTimeout(function(){item.bounceT=Math.max(item.bounceT,0.6);},i*160);
    });
  },600);

  window.__deskDebug={camera:camera,items:items,mascot:mascot,avoidCircles:avoidCircles,pickDestination:pickDestination,clearOfItems:clearOfItems,getW:function(){return W;},getH:function(){return H;},isWaving:function(){return !!waveState;},getWander:function(){return {mode:wander.mode,pos:{x:wander.pos.x,z:wander.pos.z},path:wander.path.slice(),groundY:wander.groundY,jumping:wander.jumping};}};

  (function frame(){
    var navOpen=document.getElementById("navOverlay").classList.contains("open");
    if(!document.hidden&&!navOpen){
      if(!dragging&&Math.abs(angVel)>0.0001){
        deskGroup.rotation.y=Math.max(-ROT_LIMIT,Math.min(ROT_LIMIT,deskGroup.rotation.y+angVel));
        angVel*=0.92;
        if(Math.abs(deskGroup.rotation.y)>=ROT_LIMIT-0.001)angVel=0;
      }
      items.forEach(function(item){
        item.hover+=(item.hoverTarget-item.hover)*0.18;
        var floatY=item.hover*10;
        if(item.bounceT>0){
          item.bounceT=Math.max(item.bounceT-0.045,0);
          floatY+=Math.sin(item.bounceT*Math.PI)*14;
        }
        item.group.position.y=item.group.userData.baseY+floatY;
        item.glow.position.y=item.group.position.y;
        item.glow.material.opacity=item.hover*0.22;
        item.glow.scale.setScalar(16+item.hover*6);
      });
      if(!reduceMotion){
        var nowT=Date.now();
        var fdt=lastFrameT?Math.min((nowT-lastFrameT)/1000,0.05):0.016;
        lastFrameT=nowT;

        mascot.head.rotation.y=0.6+Math.sin(nowT*0.0006)*0.18;

        if(wander.mode==="walk"){
          if(wander.path.length===0){
            wander.mode="pause";wander.pauseUntil=nowT+500;
          }else{
            var wp=wander.path[0];
            var wdx=wp.x-wander.pos.x,wdz=wp.z-wander.pos.z;
            var wdist=Math.sqrt(wdx*wdx+wdz*wdz);
            if(wdist<2.5){
              wander.path.shift();
              if(wander.path.length===0){
                wander.mode="pause";
                wander.lookCamera=Math.random()<0.5;
                wander.pauseUntil=nowT+2000+Math.random()*2200;
                if(wander.lookCamera){
                  wander.targetFacing=angleTo(-wander.pos.x*0.35,260-wander.pos.z);
                  (function(){setTimeout(function(){if(wander.mode==="pause"&&!waveState)waveState={t0:Date.now()};},450);})();
                }
              }
            }else{
              var wstep=Math.min(WALK_SPEED*fdt,wdist);
              wander.pos.x+=wdx/wdist*wstep;
              wander.pos.z+=wdz/wdist*wstep;
              wander.targetFacing=angleTo(wdx,wdz);
              wander.walkPhase+=fdt*7.2;
              mascot.leftLeg.rotation.x=Math.sin(wander.walkPhase)*LEG_SWING;
              mascot.rightLeg.rotation.x=-Math.sin(wander.walkPhase)*LEG_SWING;
              if(!waveState){
                mascot.leftArm.rotation.x=-Math.sin(wander.walkPhase)*ARM_SWING;
                mascot.rightArm.rotation.x=Math.sin(wander.walkPhase)*ARM_SWING;
              }
            }
          }
        }else{
          mascot.leftLeg.rotation.x+=(0-mascot.leftLeg.rotation.x)*0.15;
          mascot.rightLeg.rotation.x+=(0-mascot.rightLeg.rotation.x)*0.15;
          if(!waveState){
            mascot.leftArm.rotation.x+=(0-mascot.leftArm.rotation.x)*0.15;
            mascot.rightArm.rotation.x+=(0-mascot.rightArm.rotation.x)*0.15;
          }
          if(nowT>wander.pauseUntil){
            var gotPath=null,rects=itemScreenRects();
            for(var attempt=0;attempt<8;attempt++){
              var dest=pickDestination(wander.pos.x,wander.pos.z);
              if(!dest)continue;
              var cand=buildPath(wander.pos.x,wander.pos.z,dest.x,dest.z);
              if(verifyPathClear(wander.pos.x,wander.pos.z,cand,rects)){gotPath=cand;break;}
            }
            if(gotPath){
              wander.path=gotPath;
              wander.mode="walk";
              wander.walkPhase=0;
            }else{
              wander.pauseUntil=nowT+500; // couldn't find a clean route this cycle, try again shortly
            }
          }
        }

        var targetGround=groundLevelAt(wander.pos.x,wander.pos.z);
        if(targetGround!==wander.groundY&&!wander.jumping){
          wander.jumping=true;wander.jumpT0=nowT;wander.jumpFrom=wander.groundY;wander.jumpTo=targetGround;
        }
        var groundNow,jumpArc=0;
        if(wander.jumping){
          var jp=(nowT-wander.jumpT0)/JUMP_DUR;
          if(jp>=1){groundNow=wander.jumpTo;wander.groundY=wander.jumpTo;wander.jumping=false;}
          else{groundNow=wander.jumpFrom+(wander.jumpTo-wander.jumpFrom)*jp;jumpArc=Math.sin(Math.min(jp,1)*Math.PI)*JUMP_H;}
        }else{
          groundNow=wander.groundY;
        }

        var wAngDelta=shortestDelta(wander.targetFacing,wander.facing);
        var wMaxStep=TURN_SPEED*fdt;
        if(Math.abs(wAngDelta)<=wMaxStep){wander.facing=wander.targetFacing;}else{wander.facing+=(wAngDelta>0?1:-1)*wMaxStep;}
        mascot.group.rotation.y=wander.facing;
        mascot.group.position.x=wander.pos.x;
        mascot.group.position.z=wander.pos.z;
        mascotShadow.position.x=wander.pos.x;
        mascotShadow.position.z=wander.pos.z+4;
        mascotShadow.position.y=groundNow+0.15;

        var walkBounce=wander.mode==="walk"?Math.abs(Math.sin(wander.walkPhase))*WALK_BOUNCE:0;
        mascot.group.position.y=groundNow+mascotBaseY+Math.sin(nowT*0.0015)*2+walkBounce+jumpArc;

        if(waveState){
          var wvdt=Date.now()-waveState.t0,dur=1400;
          if(wvdt<dur){
            var p=wvdt/dur;
            var raise=Math.sin(Math.min(p*1.3,1)*Math.PI/2);
            mascot.rightArm.rotation.z=-1.7*raise;
            mascot.rightArm.rotation.x=Math.sin(p*Math.PI*4)*0.4*raise;
          }else{
            mascot.rightArm.rotation.z=0;mascot.rightArm.rotation.x=0;
            waveState=null;
          }
        }
      }
      updateLabels();
      renderer.render(scene,camera);
    }
    requestAnimationFrame(frame);
  })();
}
if(document.readyState==="complete"){initDeskScene();}else{window.addEventListener("load",initDeskScene);}
})();

(function(){
function initHeroMascot(){
  if(typeof THREE==="undefined")return;
  var canvas=document.getElementById("heroMascotCanvas");
  var hero=document.querySelector(".hero");
  if(!canvas||!hero)return;
  var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var w=96,h=120;
  var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.setSize(w,h,false);
  var scene=new THREE.Scene();
  var camera=new THREE.OrthographicCamera(-w/2,w/2,h/2,-h/2,1,2000);
  camera.position.z=1000;
  scene.add(new THREE.AmbientLight(0xffffff,0.85));
  var key=new THREE.DirectionalLight(0xffffff,0.6);
  key.position.set(60,120,300);
  scene.add(key);

  var m=buildMascotBody(1.05);
  m.group.position.set(0,-6,0);
  m.group.rotation.y=-0.35;
  scene.add(m.group);
  renderer.render(scene,camera);
  if(reduceMotion)return;

  var baseY=m.group.position.y;
  var nextWaveAt=1500+Math.random()*2000;
  var waveState=null;

  (function frame(t){
    t=t||0;
    if(!document.hidden){
      m.group.position.y=baseY+Math.sin(t*0.0015)*2;
      m.head.rotation.y=-0.35+Math.sin(t*0.0006)*0.2;
      if(!waveState&&t>nextWaveAt)waveState={t0:t};
      if(waveState){
        var dt=t-waveState.t0,dur=1400;
        if(dt<dur){
          var p=dt/dur;
          var raise=Math.sin(Math.min(p*1.3,1)*Math.PI/2);
          m.rightArm.rotation.z=-1.7*raise;
          m.rightArm.rotation.x=Math.sin(p*Math.PI*4)*0.4*raise;
        }else{
          m.rightArm.rotation.z=0;m.rightArm.rotation.x=0;
          waveState=null;
          nextWaveAt=t+8000+Math.random()*4000;
        }
      }
      renderer.render(scene,camera);
    }
    requestAnimationFrame(frame);
  })();
}
if(document.readyState==="complete"){initHeroMascot();}else{window.addEventListener("load",initHeroMascot);}
})();
</script>
