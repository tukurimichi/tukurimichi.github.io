(function(){
function initHeroFX(){
  if(typeof THREE==="undefined")return;
  var canvas=document.getElementById("heroCanvas");
  var hero=document.querySelector(".hero");
  if(!canvas||!hero)return;
  var w=hero.clientWidth,h=hero.clientHeight;
  if(w<10||h<10)return;
  var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(50,w/h,1,1000);
  camera.position.z=260;

  var COUNT=42;
  var bounds={x:170,y:210,z:110};
  var positions=new Float32Array(COUNT*3);
  var velocities=[];
  for(var i=0;i<COUNT;i++){
    positions[i*3]=(Math.random()*2-1)*bounds.x;
    positions[i*3+1]=(Math.random()*2-1)*bounds.y;
    positions[i*3+2]=(Math.random()*2-1)*bounds.z;
    velocities.push({x:(Math.random()*2-1)*0.14,y:(Math.random()*2-1)*0.14,z:(Math.random()*2-1)*0.09});
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(positions,3));

  function dotTexture(){
    var c=document.createElement("canvas");c.width=64;c.height=64;
    var ctx=c.getContext("2d");
    var g=ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,"rgba(255,255,255,1)");
    g.addColorStop(0.4,"rgba(255,138,128,0.85)");
    g.addColorStop(1,"rgba(227,30,36,0)");
    ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  var pts=new THREE.Points(geo,new THREE.PointsMaterial({size:9,map:dotTexture(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.8}));
  scene.add(pts);

  var maxLines=COUNT*COUNT;
  var lineGeo=new THREE.BufferGeometry();
  var linePositions=new Float32Array(maxLines*3*2);
  lineGeo.setAttribute("position",new THREE.BufferAttribute(linePositions,3));
  var lineMat=new THREE.LineBasicMaterial({color:0xE31E24,transparent:true,opacity:0.16,blending:THREE.AdditiveBlending});
  var lines=new THREE.LineSegments(lineGeo,lineMat);
  scene.add(lines);
  var LINK_DIST=92;

  function updateLines(){
    var idx=0;
    var arr=lineGeo.attributes.position.array;
    for(var i=0;i<COUNT;i++){
      for(var j=i+1;j<COUNT;j++){
        var dx=positions[i*3]-positions[j*3];
        var dy=positions[i*3+1]-positions[j*3+1];
        var dz=positions[i*3+2]-positions[j*3+2];
        var d=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if(d<LINK_DIST&&idx<maxLines){
          arr[idx*6]=positions[i*3];arr[idx*6+1]=positions[i*3+1];arr[idx*6+2]=positions[i*3+2];
          arr[idx*6+3]=positions[j*3];arr[idx*6+4]=positions[j*3+1];arr[idx*6+5]=positions[j*3+2];
          idx++;
        }
      }
    }
    lineGeo.setDrawRange(0,idx*2);
    lineGeo.attributes.position.needsUpdate=true;
  }

  function step(){
    for(var i=0;i<COUNT;i++){
      positions[i*3]+=velocities[i].x;
      positions[i*3+1]+=velocities[i].y;
      positions[i*3+2]+=velocities[i].z;
      if(positions[i*3]>bounds.x||positions[i*3]<-bounds.x)velocities[i].x*=-1;
      if(positions[i*3+1]>bounds.y||positions[i*3+1]<-bounds.y)velocities[i].y*=-1;
      if(positions[i*3+2]>bounds.z||positions[i*3+2]<-bounds.z)velocities[i].z*=-1;
    }
    geo.attributes.position.needsUpdate=true;
    updateLines();
  }

  step();
  renderer.render(scene,camera);

  if(!reduceMotion){
    (function loop(t){
      if(!document.hidden){
        step();
        camera.position.x=Math.sin((t||0)*0.00012)*22;
        camera.lookAt(0,0,0);
        renderer.render(scene,camera);
      }
      requestAnimationFrame(loop);
    })();
  }

  window.addEventListener("resize",function(){
    var nw=hero.clientWidth,nh=hero.clientHeight;
    if(nw<10||nh<10)return;
    camera.aspect=nw/nh;camera.updateProjectionMatrix();
    renderer.setSize(nw,nh,false);
  });
}
if(document.readyState==="complete"){initHeroFX();}else{window.addEventListener("load",initHeroFX);}
})();

(function(){
  var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function initOmikujiDie(){
    if(typeof THREE==="undefined")return;
    var canvas=document.getElementById("omikujiFxCanvas");
    var anchor=document.getElementById("omikujiDieAnchor");
    if(!canvas||!anchor)return;

    var W=window.innerWidth,H=window.innerHeight;
    var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(W,H,false);

    var scene=new THREE.Scene();
    var camera=new THREE.OrthographicCamera(0,W,0,H,1,2000);
    camera.position.z=1000;

    scene.add(new THREE.AmbientLight(0xffffff,0.6));
    var key=new THREE.DirectionalLight(0xffffff,0.9);
    key.position.set(200,-400,500);
    scene.add(key);
    var rim=new THREE.DirectionalLight(0xff8a80,0.5);
    rim.position.set(-250,300,-200);
    scene.add(rim);

    var R=44;
    var geo=new THREE.DodecahedronGeometry(R,0);
    var mat=new THREE.MeshStandardMaterial({color:0xE31E24,roughness:0.35,metalness:0.15,flatShading:true});
    var die=new THREE.Mesh(geo,mat);
    var edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xF2F0EC,transparent:true,opacity:0.55}));
    die.add(edges);
    die.rotation.set(0.4,0.6,0);
    scene.add(die);

    var anchorX=0,anchorY=0,rolling=false;
    die.visible=false;
    function anchorCenter(){
      var r=anchor.getBoundingClientRect();
      return {x:r.left+r.width/2,y:r.top+r.height/2};
    }
    function onResize(){
      W=window.innerWidth;H=window.innerHeight;
      renderer.setSize(W,H,false);
      camera.right=W;camera.bottom=H;
      camera.updateProjectionMatrix();
      renderer.render(scene,camera);
    }
    window.addEventListener("resize",onResize);

    function easeOutCubic(x){return 1-Math.pow(1-x,3);}
    function easeOutBounce(x){
      var n1=7.5625,d1=2.75;
      if(x<1/d1)return n1*x*x;
      else if(x<2/d1)return n1*(x-=1.5/d1)*x+0.75;
      else if(x<2.5/d1)return n1*(x-=2.25/d1)*x+0.9375;
      else return n1*(x-=2.625/d1)*x+0.984375;
    }
    function rollOnce(onDone){
      var dropHeight=250+Math.random()*70;
      var startX=anchorX+(Math.random()*2-1)*18;
      var startY=anchorY-dropHeight;
      var startScale=0.55;
      var baseRotX=die.rotation.x,baseRotY=die.rotation.y,baseRotZ=die.rotation.z;
      var spinDir=Math.random()<0.5?-1:1;
      var tumbleX=spinDir*(Math.PI*4+Math.random()*Math.PI*3);
      var tumbleY=spinDir*(Math.PI*3+Math.random()*Math.PI*2.5)*(Math.random()<0.5?-1:1);
      var tumbleZ=(Math.random()*2-1)*(Math.PI*2+Math.random()*Math.PI*2);
      var duration=1500;
      var t0=null;
      die.visible=true;
      function frame(t){
        if(t0===null)t0=t;
        var p=Math.min((t-t0)/duration,1);
        var eBounce=easeOutBounce(p);
        var eSettle=easeOutCubic(Math.min(p*1.4,1));
        var eRot=easeOutCubic(p);
        var curX=startX+(anchorX-startX)*eSettle;
        var curY=startY+(anchorY-startY)*eBounce;
        var curScale=startScale+(1-startScale)*eSettle;
        die.position.set(curX,curY,0);
        die.scale.setScalar(curScale);
        die.rotation.x=baseRotX+tumbleX*eRot;
        die.rotation.y=baseRotY+tumbleY*eRot;
        die.rotation.z=baseRotZ+tumbleZ*eRot;
        renderer.render(scene,camera);
        if(p<1){requestAnimationFrame(frame);}
        else{
          die.position.set(anchorX,anchorY,0);
          die.scale.setScalar(1);
          renderer.render(scene,camera);
          if(onDone)onDone();
        }
      }
      requestAnimationFrame(frame);
    }
    window.__omikujiRoll=function(onDone){
      if(rolling){return;}
      var c=anchorCenter();
      anchorX=c.x;anchorY=c.y;
      rolling=true;
      if(reduceMotion){
        die.visible=true;
        die.position.set(anchorX,anchorY,0);
        die.scale.setScalar(1);
        renderer.render(scene,camera);
        rolling=false;if(onDone)onDone();return;
      }
      var done=false;
      function finish(){
        if(done)return;
        done=true;
        rolling=false;
        if(onDone)onDone();
      }
      rollOnce(finish);
      setTimeout(finish,2300);
    };
  }
  if(document.readyState==="complete"){initOmikujiDie();}else{window.addEventListener("load",initOmikujiDie);}
})();

(function(){
  var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function initJankenCard(){
    if(typeof THREE==="undefined"||typeof THREE.GLTFLoader==="undefined")return;
    var canvas=document.getElementById("jankenFxCanvas");
    var anchor=document.getElementById("jankenHandAnchor");
    if(!canvas||!anchor)return;

    var W=window.innerWidth,H=window.innerHeight;
    var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(W,H,false);
    if("outputEncoding" in renderer)renderer.outputEncoding=THREE.sRGBEncoding;

    var scene=new THREE.Scene();
    // top/bottom kept in standard (non-inverted) orientation here, unlike the
    // omikuji die's camera, so glTF's native Y-up meshes need no extra flip.
    var camera=new THREE.OrthographicCamera(0,W,H,0,1,2000);
    camera.position.z=1000;

    scene.add(new THREE.AmbientLight(0xffffff,0.8));
    var keyLight=new THREE.DirectionalLight(0xffffff,0.9);
    keyLight.position.set(200,400,600);
    scene.add(keyLight);
    var rimLight=new THREE.DirectionalLight(0xfff2df,0.45);
    rimLight.position.set(-300,120,-400);
    scene.add(rimLight);

    var order=["g","c","p"];
    var GLB_URLS={g:"janken_g.glb",c:"janken_c.glb",p:"janken_p.glb"};
    var HAND_SCALE=150;
    // per-model resting yaw so each glTF's most legible side faces the camera
    // (found by rendering every model at 8 angles and comparing).
    var FRONT_YAW={g:-Math.PI/2,c:0,p:-Math.PI/2};

    var draco=new THREE.DRACOLoader();
    draco.setDecoderPath("https://unpkg.com/three@0.128.0/examples/js/libs/draco/gltf/");
    var loader=new THREE.GLTFLoader();
    loader.setDRACOLoader(draco);

    var rig=new THREE.Group();
    rig.visible=false;
    scene.add(rig);

    var models={};
    order.forEach(function(k){
      loader.load(GLB_URLS[k],function(gltf){
        var root=gltf.scene;
        root.scale.setScalar(HAND_SCALE);
        root.rotation.y=FRONT_YAW[k]||0;
        root.visible=false;
        rig.add(root);
        models[k]=root;
      });
    });
    function allLoaded(){return order.every(function(k){return !!models[k];});}
    function showOnly(k){order.forEach(function(o){if(models[o])models[o].visible=(o===k);});}

    var anchorX=0,anchorY=0,rolling=false;
    function anchorCenter(){
      var r=anchor.getBoundingClientRect();
      return {x:r.left+r.width/2,y:H-(r.top+r.height/2)};
    }
    function onResize(){
      W=window.innerWidth;H=window.innerHeight;
      renderer.setSize(W,H,false);
      camera.right=W;camera.top=H;
      camera.updateProjectionMatrix();
      renderer.render(scene,camera);
    }
    window.addEventListener("resize",onResize);

    function easeOutCubic(x){return 1-Math.pow(1-x,3);}
    function easeOutBounce(x){
      var n1=7.5625,d1=2.75;
      if(x<1/d1)return n1*x*x;
      else if(x<2/d1)return n1*(x-=1.5/d1)*x+0.75;
      else if(x<2.5/d1)return n1*(x-=2.25/d1)*x+0.9375;
      else return n1*(x-=2.625/d1)*x+0.984375;
    }

    function settleTo(finalHand){
      showOnly(finalHand);
      rig.visible=true;
      rig.position.set(anchorX,anchorY,0);
      rig.scale.setScalar(1);
      rig.rotation.set(0,0,0);
      renderer.render(scene,camera);
    }

    function playReveal(finalHand,onDone){
      var dropHeight=260+Math.random()*60;
      var startX=anchorX+(Math.random()*2-1)*16;
      var startY=anchorY+dropHeight;
      var startScale=0.5;
      // Pick a half-turn count that (a) is even, so the model always ends up
      // facing forward, and (b) lands the cycling reveal exactly on finalHand
      // at the last swap, so settling never has to visibly "correct" the pose.
      var HALF_TURNS_BASE={g:4,c:2,p:6};
      var extraCycles=Math.floor(Math.random()*3);
      var totalHalfTurns=HALF_TURNS_BASE[finalHand]+6*extraCycles;
      var totalSpin=Math.PI*totalHalfTurns*(Math.random()<0.5?-1:1);
      var duration=1500;
      var t0=null,lastHalf=0,stopped=false;
      showOnly(order[0]);
      rig.visible=true;
      function frame(t){
        if(stopped)return;
        if(t0===null)t0=t;
        var p=Math.min((t-t0)/duration,1);
        var eBounce=easeOutBounce(p);
        var eSettle=easeOutCubic(p);
        var curX=startX+(anchorX-startX)*eSettle;
        var curY=startY+(anchorY-startY)*eBounce;
        var curScale=startScale+(1-startScale)*eSettle;
        var curRotY=totalSpin*eSettle;
        rig.position.set(curX,curY,0);
        rig.scale.setScalar(curScale);
        rig.rotation.y=curRotY;
        rig.rotation.x=0.06*(1-eSettle);
        var halfIdx=Math.floor(Math.abs(curRotY)/Math.PI);
        if(halfIdx!==lastHalf){
          lastHalf=halfIdx;
          if(p<0.97){showOnly(order[halfIdx%3]);}
        }
        renderer.render(scene,camera);
        if(p<1){requestAnimationFrame(frame);}
        else{
          stopped=true;
          settleTo(finalHand);
          if(onDone)onDone();
        }
      }
      requestAnimationFrame(frame);
      return{stop:function(){stopped=true;settleTo(finalHand);}};
    }

    window.__jankenReveal=function(finalHand,onDone){
      if(rolling){return;}
      var c=anchorCenter();
      anchorX=c.x;anchorY=c.y;
      rolling=true;
      if(reduceMotion||!allLoaded()){
        settleTo(finalHand);
        rolling=false;if(onDone)onDone();return;
      }
      var done=false,handle=null;
      function finish(){
        if(done)return;
        done=true;
        rolling=false;
        if(handle)handle.stop();
        if(onDone)onDone();
      }
      handle=playReveal(finalHand,finish);
      setTimeout(finish,2300);
    };
  }
  if(document.readyState==="complete"){initJankenCard();}else{window.addEventListener("load",initJankenCard);}
})();
</script>
