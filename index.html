function jRenderStats(lang){

if(s.win+s.lose+s.draw>0){document.getElementById("jstats").textContent=L.statsFmt(s);}
else{document.getElementById("jstats").textContent="";}
}

document.getElementById("cap1").textContent=L.cap1;
document.getElementById("cap2").textContent=L.cap2;
document.getElementById("cap3").textContent=L.cap3;
document.getElementById("cap4").textContent=L.cap4;
document.getElementById("storyBoothLink").textContent=L.storyNoteText;

document.getElementById("idea").onclick=function(){

var ideaUrl="https://x.com/intent/post?text="+encodeURIComponent(L.ideaShareText);
window.open(ideaUrl,"_blank");
if(window.gtag){gtag("event","idea_click");}
};
function jankenPlay(userHand){
var L=LANG[currentLang];
var hands=["g","c","p"];
var aiHand=hands[Math.floor(Math.random()*3)];
var result;
if(userHand===aiHand){result="draw";}
else if((userHand==="g"&&aiHand==="c")||(userHand==="c"&&aiHand==="p")||(userHand==="p"&&aiHand==="g")){result="win";}
else{result="lose";}
var s=JSON.parse(localStorage.getItem("jstats")||'{"win":0,"lose":0,"draw":0,"streak":0}');
var msg;
if(result==="win"){s.win++;s.streak++;msg=L.winMsgs[Math.floor(Math.random()*L.winMsgs.length)];}
else if(result==="lose"){s.lose++;s.streak=0;msg=L.loseMsgs[Math.floor(Math.random()*L.loseMsgs.length)];}
else{s.draw++;msg=L.drawMsg;}
localStorage.setItem("jstats",JSON.stringify(s));
document.getElementById("jresult").innerHTML=L.youLabel+L.jhands[userHand]+L.jnames[userHand]+" vs AI:"+L.jhands[aiHand]+L.jnames[aiHand]+"<br>"+msg;
document.getElementById("jstats").textContent=L.statsFmt(s);
var resultLabel=result==="win"?L.resultWin:(result==="lose"?L.resultLose:L.resultDraw);
var shareText=L.jankenShareFmt(resultLabel,s);
var shareUrl="https://x.com/intent/post?text="+encodeURIComponent(shareText)+"&url="+encodeURIComponent("https://tukurimichi.com/");
document.getElementById("jshare").innerHTML="<a href='"+shareUrl+"' target='_blank' rel='noopener'>"+L.shareLinkLabel+"</a>";
if(window.gtag){gtag("event","janken_play",{"result":result});}
}
document.getElementById("jg").onclick=function(){jankenPlay("g");};
document.getElementById("jc").onclick=function(){jankenPlay("c");};
document.getElementById("jp").onclick=function(){jankenPlay("p");};
render(currentLang);
</script>
