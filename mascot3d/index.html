  <style>
    #langToggle{position:fixed;right:12px;top:12px;z-index:30;background:rgba(10,10,11,.55);border:1px solid rgba(255,255,255,.35);color:#F2F0EC;border-radius:20px;padding:6px 13px;font-size:.72rem;cursor:pointer;backdrop-filter:blur(2px);font-family:inherit;}
    #langToggle[hidden]{display:none;}
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #2b394a 0%, #0d131a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #motion-ui {
      position: absolute;
      top: 15px;
      left: 15px;
      display: grid;
      grid-template-columns: repeat(2, 110px);
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }
    .motion-btn {
      background: #2c3545;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .motion-btn:hover { background: #3e4a5e; }
    .motion-btn.active {
      background: #ff6b22;
      border-color: #ff8c32;
      box-shadow: 0 0 10px rgba(255, 107, 34, 0.5);
    }

    #info-text {
      position: absolute;
      bottom: 25px;
      left: 25px;
      color: #ccc;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      line-height: 1.5;
    }

    #pad-container {
      position: absolute;
      bottom: 25px;
      right: 25px;
      display: flex;
      gap: 16px;
      align-items: flex-end;
      z-index: 10;
    }
    .pad-box {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .turn-pad {
      display: flex;
      gap: 8px;
    }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 6px;
    }
    .ctrl-btn {
      background: #2c3545;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      outline: none;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: #ff6b22;
      transform: scale(0.92);
    }
    #btn-fwd { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-back { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }

    @media (max-width: 480px) {
      #motion-ui {
        top: 10px;
        left: 10px;
        grid-template-columns: repeat(2, 82px);
        gap: 6px;
        padding: 8px;
      }
      .motion-btn {
        font-size: 10px;
        padding: 6px 0;
      }
      #info-text {
        display: none;
      }
      #pad-container {
        bottom: 12px;
        right: 12px;
        gap: 10px;
      }
      .pad-box {
        padding: 8px;
        border-radius: 12px;
      }
      .d-pad {
        grid-template-columns: repeat(3, 38px);
        grid-template-rows: repeat(3, 38px);
        gap: 5px;
      }
      .ctrl-btn {
        font-size: 13px;
      }
      .turn-pad .ctrl-btn {
        width: 38px !important;

      }

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <button id="langToggle" hidden>English</button>
  <div id="motion-ui">
    <button id="btn-idle" class="motion-btn active">🟢 待機</button>
    <button id="btn-walk" class="motion-btn">🚶 歩く</button>
    <button id="btn-run" class="motion-btn">🏃 走る</button>
    <button id="btn-jump" class="motion-btn">🚀 ジャンプ</button>
    <button id="btn-dance" class="motion-btn">🕺 ダンス</button>
    <button id="btn-wave" class="motion-btn">👋 挨拶</button>
    <button id="btn-sad" class="motion-btn">😞 落ち込む</button>
    <button id="btn-fall" class="motion-btn">💥 倒れる</button>
  </div>

  <div id="info-text">
    🏃 <b>走る選択時</b>: 移動速度が倍速になり、スピーディな走行フォームで移動します<br>
    ⌨️ <b>操作</b>: 矢印キー または W/A/S/D（Q / E で水平旋回）
  </div>

  <div id="pad-container">
    <div class="pad-box turn-pad">
      <button id="btn-rot-left" class="ctrl-btn" style="width: 44px; height: 44px;" title="左旋回">↺</button>
      <button id="btn-rot-right" class="ctrl-btn" style="width: 44px; height: 44px;" title="右旋回">↻</button>
    </div>
    <div class="pad-box d-pad">
      <button id="btn-fwd" class="ctrl-btn">▲</button>
      <button id="btn-left" class="ctrl-btn">◀</button>
      <button id="btn-back" class="ctrl-btn">▼</button>
      <button id="btn-right" class="ctrl-btn">▶</button>
    </div>
  </div>

  <script>
    // --- シーン・カメラ・レンダラー ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // iframe埋め込み時にキー操作が効くよう、キャンバス操作でフォーカスを取得する
    renderer.domElement.tabIndex = 0;
    renderer.domElement.addEventListener('pointerdown', () => { window.focus(); });
    renderer.domElement.addEventListener('touchstart', () => { window.focus(); }, { passive: true });

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- ライティング ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const mainLight = new THREE.DirectionalLight(0xfff5ea, 1.6);
    mainLight.position.set(10, 15, 10);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x70a1ff, 0.7);
    fillLight.position.set(-10, 8, -10);
    scene.add(fillLight);

    // --- 床・広域グリッド ---
    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x151b24, roughness: 0.8, metalness: 0.2 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(80, 80, 0xff8c32, 0x2c3545);
    grid.position.y = 0.005;
    scene.add(grid);

    // --- マテリアル定義 ---
    const orangeMat = new THREE.MeshStandardMaterial({ color: 0xff6b22, roughness: 0.25, metalness: 0.15 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf0f2f5, roughness: 0.2, metalness: 0.05 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0x4a4f57, roughness: 0.4, metalness: 0.8 });
    const screenMat = new THREE.MeshStandardMaterial({ color: 0x15181e, roughness: 0.1, metalness: 0.3 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffb703 });

    // --- ロボット構造 ---
    const robotRoot = new THREE.Group();
    scene.add(robotRoot);

    const robotBodyGroup = new THREE.Group();
    robotRoot.add(robotBodyGroup);

    // 胴体
    const chest = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.85, 0.8), whiteMat);
    chest.position.set(0, 1.35, 0);
    robotBodyGroup.add(chest);

    const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.15), orangeMat);
    chestPlate.position.set(0, 1.45, 0.4);
    robotBodyGroup.add(chestPlate);

    const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.35, 0.3, 32), jointMat);
    pelvis.position.set(0, 0.82, 0);
    robotBodyGroup.add(pelvis);

    // 頭部
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 2.4, 0);
    robotBodyGroup.add(headGroup);

    headGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.3, 1.2), orangeMat));
    const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.1, 0.2), whiteMat);
    bezel.position.set(0, 0, 0.55);
    headGroup.add(bezel);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), screenMat);
    screen.position.set(0, 0, 0.66);
    headGroup.add(screen);

    const eyeGeo = new THREE.CircleGeometry(0.12, 32);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.32, 0.05, 0.67);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.32, 0.05, 0.67);
    headGroup.add(leftEye, rightEye);

    const antPole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 16), jointMat);
    antPole.position.set(0.45, 0.8, 0);
    antPole.rotation.z = -0.2;
    const antTip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), orangeMat);
    antTip.position.set(0.52, 0.98, 0);
    headGroup.add(antPole, antTip);

    const earGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.15, 32);
    const leftEar = new THREE.Mesh(earGeo, jointMat);
    leftEar.rotation.z = Math.PI / 2;
    leftEar.position.set(-0.85, 0, 0);
    const rightEar = leftEar.clone();
    rightEar.position.x = 0.85;
    headGroup.add(leftEar, rightEar);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.25, 32), jointMat);
    neck.position.set(0, 1.7, 0);
    robotBodyGroup.add(neck);

    // 腕部
    function buildArm(isLeft) {
      const side = isLeft ? -1 : 1;
      const shPivot = new THREE.Group();
      shPivot.position.set(side * 0.75, 1.55, 0);
      shPivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), whiteMat));

      const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.35, 16), jointMat);
      upperArm.position.set(side * 0.05, -0.25, 0);
      upperArm.rotation.z = side * -0.15;
      shPivot.add(upperArm);

      const elPivot = new THREE.Group();
      elPivot.position.set(side * 0.08, -0.45, 0);
      shPivot.add(elPivot);

      const foreArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.4), orangeMat);
      foreArm.position.set(0, -0.2, 0.05);
      elPivot.add(foreArm);

      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 0.25), jointMat);
      hand.position.set(0, -0.48, 0.05);
      elPivot.add(hand);

      robotBodyGroup.add(shPivot);
      return { shoulder: shPivot, elbow: elPivot };
    }
    const leftArm = buildArm(true);
    const rightArm = buildArm(false);

    // 脚部
    function buildLeg(isLeft) {
      const side = isLeft ? -1 : 1;
      const hipPivot = new THREE.Group();
      hipPivot.position.set(side * 0.4, 0.75, 0);
      hipPivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), jointMat));

      const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.4, 0.45), orangeMat);
      thigh.position.set(0, -0.22, 0);
      hipPivot.add(thigh);

      const knPivot = new THREE.Group();
      knPivot.position.set(0, -0.42, 0);
      hipPivot.add(knPivot);

      const shin = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.42), whiteMat);
      shin.position.set(0, -0.15, 0);
      knPivot.add(shin);

      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.2, 0.75), orangeMat);
      foot.position.set(0, -0.32, 0.1);
      knPivot.add(foot);

      const sole = new THREE.Mesh(new THREE.BoxGeometry(0.57, 0.06, 0.77), jointMat);
      sole.position.set(0, -0.42, 0.1);
      knPivot.add(sole);

      robotBodyGroup.add(hipPivot);
      return { hip: hipPivot, knee: knPivot };
    }
    const leftLeg = buildLeg(true);
    const rightLeg = buildLeg(false);

    robotRoot.traverse((c) => {
      if (c.isMesh) {
        c.castShadow = true;
        c.receiveShadow = true;
      }
    });

    // --- コントローラー入力管理 ---
    const inputState = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      rotLeft: false,
      rotRight: false
    };

    function bindButton(id, key) {
      const btn = document.getElementById(id);
      const start = (e) => { e.preventDefault(); inputState[key] = true; btn.classList.add('pressed'); };
      const end = (e) => { e.preventDefault(); inputState[key] = false; btn.classList.remove('pressed'); };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', end);
      btn.addEventListener('pointerleave', end);
    }
    bindButton('btn-fwd', 'forward');
    bindButton('btn-back', 'backward');
    bindButton('btn-left', 'left');
    bindButton('btn-right', 'right');
    bindButton('btn-rot-left', 'rotLeft');
    bindButton('btn-rot-right', 'rotRight');

    const navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];

    window.addEventListener('keydown', (e) => {
      // iframe埋め込み時に矢印キー・スペースで親ページがスクロールしないようにする
      if (navKeys.includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputState.forward = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputState.backward = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputState.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputState.right = true;
      if (e.key === 'q' || e.key === 'Q') inputState.rotLeft = true;
      if (e.key === 'e' || e.key === 'E') inputState.rotRight = true;
    });
    window.addEventListener('keyup', (e) => {
      if (navKeys.includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputState.forward = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputState.backward = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputState.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputState.right = false;
      if (e.key === 'q' || e.key === 'Q') inputState.rotLeft = false;
      if (e.key === 'e' || e.key === 'E') inputState.rotRight = false;
    });

    // --- モーション管理 ---
    let currentMotion = 'idle';
    let motionTime = 0;
    let moveAnimTime = 0;

    const motionButtons = document.querySelectorAll('.motion-btn');
    motionButtons.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        motionButtons.forEach((b) => b.classList.remove('active'));
        e.target.classList.add('active');
        currentMotion = e.target.id.replace('btn-', '');
        motionTime = 0;
        resetPose();
      });
    });

    function resetPose() {
      robotBodyGroup.position.set(0, 0, 0);
      robotBodyGroup.rotation.set(0, 0, 0);
      headGroup.rotation.set(0, 0, 0);

      leftArm.shoulder.rotation.set(0, 0, 0);
      rightArm.shoulder.rotation.set(0, 0, 0);
      leftArm.elbow.rotation.set(0, 0, 0);
      rightArm.elbow.rotation.set(0, 0, 0);

      leftLeg.hip.rotation.set(0, 0, 0);
      rightLeg.hip.rotation.set(0, 0, 0);
      leftLeg.knee.rotation.set(0, 0, 0);
      rightLeg.knee.rotation.set(0, 0, 0);
    }

    // --- アニメーションループ ---
    const clock = new THREE.Clock();
    const rotSpeed = 2.4;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      motionTime += dt;

      const isMoving = inputState.forward || inputState.backward || inputState.left || inputState.right;
      const isRunningMode = currentMotion === 'run';

      // 走るモード選択時は移動スピードを倍増 (通常: 3.5 / 走る: 7.2)
      const currentMoveSpeed = isRunningMode ? 7.2 : 3.5;

      // 1. 水平回転（旋回）
      if (inputState.rotLeft) robotRoot.rotation.y += rotSpeed * dt;
      if (inputState.rotRight) robotRoot.rotation.y -= rotSpeed * dt;

      // 2. ロボット正面基準の移動
      if (isMoving) {
        const forwardVector = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), robotRoot.rotation.y);
        const rightVector = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), robotRoot.rotation.y);

        const moveDirection = new THREE.Vector3(0, 0, 0);

        if (inputState.forward) moveDirection.add(forwardVector);
        if (inputState.backward) moveDirection.sub(forwardVector);
        if (inputState.left) moveDirection.add(rightVector);
        if (inputState.right) moveDirection.sub(rightVector);

        if (moveDirection.lengthSq() > 0) {
          moveDirection.normalize();
          robotRoot.position.addScaledVector(moveDirection, currentMoveSpeed * dt);
        }

        controls.target.lerp(new THREE.Vector3(robotRoot.position.x, 1.2, robotRoot.position.z), 0.1);
      }

      // 3. モーションの適用
      if (isMoving) {
        if (isRunningMode) {
          // --- 走行時の高速ピッチ・前傾姿勢モーション ---
          moveAnimTime += dt * 11.0;
          const rt = moveAnimTime;

          leftLeg.hip.rotation.x = Math.sin(rt) * 0.95;
          rightLeg.hip.rotation.x = Math.sin(rt + Math.PI) * 0.95;
          leftLeg.knee.rotation.x = Math.max(0, -Math.sin(rt)) * 1.3;
          rightLeg.knee.rotation.x = Math.max(0, -Math.sin(rt + Math.PI)) * 1.3;

          leftArm.shoulder.rotation.x = -Math.sin(rt) * 1.15;
          rightArm.shoulder.rotation.x = -Math.sin(rt + Math.PI) * 1.15;
          leftArm.elbow.rotation.x = -0.85;
          rightArm.elbow.rotation.x = -0.85;

          robotBodyGroup.position.y = 0.1 + Math.abs(Math.sin(rt)) * 0.18;
          robotBodyGroup.rotation.x = 0.24; // 前傾姿勢
          robotBodyGroup.rotation.y = Math.sin(rt) * 0.12;
          robotBodyGroup.rotation.z = Math.sin(rt) * 0.05;
          headGroup.rotation.x = -0.22; // 顔は前を向く
          headGroup.rotation.y = -Math.sin(rt) * 0.08;
        } else {
          // --- 通常歩行モーション ---
          moveAnimTime += dt * 6.5;
          const wt = moveAnimTime;

          leftLeg.hip.rotation.x = Math.sin(wt) * 0.65;
          rightLeg.hip.rotation.x = Math.sin(wt + Math.PI) * 0.65;
          leftLeg.knee.rotation.x = Math.max(0, -Math.sin(wt)) * 0.85;
          rightLeg.knee.rotation.x = Math.max(0, -Math.sin(wt + Math.PI)) * 0.85;

          leftArm.shoulder.rotation.x = -Math.sin(wt) * 0.75;
          rightArm.shoulder.rotation.x = -Math.sin(wt + Math.PI) * 0.75;
          leftArm.elbow.rotation.x = -0.25 - Math.max(0, -Math.sin(wt)) * 0.4;
          rightArm.elbow.rotation.x = -0.25 - Math.max(0, -Math.sin(wt + Math.PI)) * 0.4;

          robotBodyGroup.position.y = 0.08 + Math.abs(Math.cos(wt)) * 0.08;
          robotBodyGroup.rotation.x = 0.0;
          robotBodyGroup.rotation.y = Math.sin(wt) * 0.1;
          robotBodyGroup.rotation.z = Math.sin(wt) * 0.04;
          headGroup.rotation.x = 0.0;
          headGroup.rotation.y = -Math.sin(wt) * 0.06;
        }
      } else {
        // --- 停止時の各アクションモーション ---
        const t = motionTime;
        switch (currentMotion) {
          case 'idle':
            robotBodyGroup.position.y = Math.sin(t * 2.0) * 0.03;
            headGroup.rotation.y = Math.sin(t * 1.0) * 0.08;
            headGroup.rotation.x = Math.sin(t * 1.5) * 0.04;
            leftArm.shoulder.rotation.z = 0.1 + Math.sin(t * 2.0) * 0.04;
            rightArm.shoulder.rotation.z = -0.1 - Math.sin(t * 2.0) * 0.04;
            leftArm.elbow.rotation.x = -0.15;
            rightArm.elbow.rotation.x = -0.15;
            break;

          case 'walk':
            const wt = t * 5.0;
            leftLeg.hip.rotation.x = Math.sin(wt) * 0.6;
            rightLeg.hip.rotation.x = Math.sin(wt + Math.PI) * 0.6;
            leftLeg.knee.rotation.x = Math.max(0, -Math.sin(wt)) * 0.8;
            rightLeg.knee.rotation.x = Math.max(0, -Math.sin(wt + Math.PI)) * 0.8;

            leftArm.shoulder.rotation.x = -Math.sin(wt) * 0.7;
            rightArm.shoulder.rotation.x = -Math.sin(wt + Math.PI) * 0.7;
            leftArm.elbow.rotation.x = -0.2 - Math.max(0, -Math.sin(wt)) * 0.4;
            rightArm.elbow.rotation.x = -0.2 - Math.max(0, -Math.sin(wt + Math.PI)) * 0.4;

            robotBodyGroup.position.y = 0.08 + Math.abs(Math.cos(wt)) * 0.08;
            robotBodyGroup.rotation.y = Math.sin(wt) * 0.1;
            robotBodyGroup.rotation.z = Math.sin(wt) * 0.04;
            headGroup.rotation.y = -Math.sin(wt) * 0.06;
            break;

          case 'run':
            // その場駆け足
            const rt = t * 10.0;
            leftLeg.hip.rotation.x = Math.sin(rt) * 0.9;
            rightLeg.hip.rotation.x = Math.sin(rt + Math.PI) * 0.9;
            leftLeg.knee.rotation.x = Math.max(0, -Math.sin(rt)) * 1.2;
            rightLeg.knee.rotation.x = Math.max(0, -Math.sin(rt + Math.PI)) * 1.2;

            leftArm.shoulder.rotation.x = -Math.sin(rt) * 1.1;
            rightArm.shoulder.rotation.x = -Math.sin(rt + Math.PI) * 1.1;
            leftArm.elbow.rotation.x = -0.8;
            rightArm.elbow.rotation.x = -0.8;

            robotBodyGroup.position.y = 0.1 + Math.abs(Math.sin(rt)) * 0.18;
            robotBodyGroup.rotation.x = 0.22;
            headGroup.rotation.x = -0.2;
            break;

          case 'jump':
            const jt = t * 4.0;
            const phase = jt % (Math.PI * 2);
            if (phase < Math.PI) {
              robotBodyGroup.position.y = Math.sin(phase) * 1.5;
              leftLeg.hip.rotation.x = -0.2;
              rightLeg.hip.rotation.x = -0.3;
              leftLeg.knee.rotation.x = 0.7;
              rightLeg.knee.rotation.x = 0.7;
              leftArm.shoulder.rotation.z = 1.2;
              rightArm.shoulder.rotation.z = -1.2;
            } else {
              robotBodyGroup.position.y = -0.25 + Math.sin(phase) * 0.25;
              leftLeg.hip.rotation.x = -0.7;
              rightLeg.hip.rotation.x = -0.7;
              leftLeg.knee.rotation.x = 1.4;
              rightLeg.knee.rotation.x = 1.4;
              leftArm.shoulder.rotation.x = -0.4;
              rightArm.shoulder.rotation.x = -0.4;
            }
            break;

          case 'dance':
            const dt_ = t * 6.0;
            robotBodyGroup.position.y = Math.abs(Math.sin(dt_)) * 0.15;
            robotBodyGroup.rotation.z = Math.sin(dt_ * 0.5) * 0.2;
            leftArm.shoulder.rotation.z = Math.abs(Math.sin(dt_)) * 2.0;
            rightArm.shoulder.rotation.x = Math.cos(dt_) * 1.5;
            headGroup.rotation.y = Math.sin(dt_) * 0.4;
            headGroup.rotation.z = Math.cos(dt_) * 0.2;
            break;

          case 'wave':
            rightArm.shoulder.rotation.z = -2.2;
            rightArm.shoulder.rotation.x = 0.2;
            rightArm.shoulder.rotation.y = 0.4;
            rightArm.elbow.rotation.x = -1.2;
            rightArm.elbow.rotation.y = -0.5;
            rightArm.elbow.rotation.z = -0.3 + Math.sin(t * 7.0) * 0.4;

            leftArm.shoulder.rotation.z = 0.15;
            leftArm.elbow.rotation.x = -0.15;

            headGroup.rotation.y = 0.2;
            headGroup.rotation.z = -0.12;
            robotBodyGroup.position.y = 0.02 + Math.sin(t * 3.5) * 0.02;
            break;

          case 'sad':
            const sadProgress = Math.min(t * 1.5, 1.0);
            const easeSad = sadProgress * sadProgress * (3 - 2 * sadProgress);

            headGroup.rotation.x = easeSad * 0.55;
            if (sadProgress >= 1.0) headGroup.rotation.x += Math.sin(t * 1.5) * 0.03;

            robotBodyGroup.rotation.x = easeSad * 0.15;
            leftArm.shoulder.rotation.z = -0.05 + easeSad * -0.1;
            rightArm.shoulder.rotation.z = 0.05 + easeSad * 0.1;
            leftArm.shoulder.rotation.x = easeSad * 0.25;
            rightArm.shoulder.rotation.x = easeSad * 0.25;
            leftArm.elbow.rotation.x = -0.1;
            rightArm.elbow.rotation.x = -0.1;

            robotBodyGroup.position.y = 0.0;
            robotBodyGroup.position.z = 0.0;
            leftLeg.hip.rotation.x = 0.0;
            rightLeg.hip.rotation.x = 0.0;
            leftLeg.knee.rotation.x = 0.0;
            rightLeg.knee.rotation.x = 0.0;
            break;

          case 'fall':
            const fallProgress = Math.min(t * 3.5, 1.0);
            const easeFall = fallProgress * fallProgress;
            const fallAngle = easeFall * (Math.PI / 2);

            robotBodyGroup.rotation.x = fallAngle;
            robotBodyGroup.position.y = easeFall * 0.45;
            robotBodyGroup.position.z = easeFall * 1.35;

            leftArm.shoulder.rotation.x = -fallAngle * 0.9;
            rightArm.shoulder.rotation.x = -fallAngle * 0.9;
            leftArm.shoulder.rotation.z = 0.4;
            rightArm.shoulder.rotation.z = -0.4;

            leftLeg.knee.rotation.x = easeFall * 0.15;
            rightLeg.knee.rotation.x = easeFall * 0.15;

            if (fallProgress >= 1.0) headGroup.rotation.x = -0.15;
            break;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

<script>
(function(){
  var LANG={
    ja:{title:"マスコット3D（動かせる版） | tukurimichi.com",
        desc:"マスコットの3Dモデルを歩かせたり踊らせたりできるビューア。矢印キーまたはW/A/S/Dで動かせます。",
        toggleTo:"English",
        btn:{"btn-idle":"\uD83D\uDFE2 待機","btn-walk":"\uD83D\uDEB6 歩く","btn-run":"\uD83C\uDFC3 走る","btn-jump":"\uD83D\uDE80 ジャンプ",
             "btn-dance":"\uD83D\uDD7A ダンス","btn-wave":"\uD83D\uDC4B 挨拶","btn-sad":"\uD83D\uDE1E 落ち込む","btn-fall":"\uD83D\uDCA5 倒れる"},
        info:"\uD83C\uDFC3 <b>走る選択時</b>: 移動速度が倍速になり、スピーディな走行フォームで移動します<br>\u2328\uFE0F <b>操作</b>: 矢印キー または W/A/S/D（Q / E で水平旋回）",
        rotL:"左旋回", rotR:"右旋回"},
    en:{title:"The 3D Mascot \u2014 Playable | tukurimichi.com",
        desc:"A viewer where you can walk, run and dance the 3D mascot. Use the arrow keys or W/A/S/D.",
        toggleTo:"日本語",
        btn:{"btn-idle":"\uD83D\uDFE2 Idle","btn-walk":"\uD83D\uDEB6 Walk","btn-run":"\uD83C\uDFC3 Run","btn-jump":"\uD83D\uDE80 Jump",
             "btn-dance":"\uD83D\uDD7A Dance","btn-wave":"\uD83D\uDC4B Wave","btn-sad":"\uD83D\uDE1E Sad","btn-fall":"\uD83D\uDCA5 Fall"},
        info:"\uD83C\uDFC3 <b>Run mode</b>: moves at double speed with a faster running form<br>\u2328\uFE0F <b>Controls</b>: arrow keys or W/A/S/D (Q / E to turn)",
        rotL:"Turn left", rotR:"Turn right"}
  };
  function cur(){ return localStorage.getItem("lang") || ((navigator.language && navigator.language.indexOf("en")===0) ? "en" : "ja"); }
  function render(l){
    var L=LANG[l]||LANG.ja;
    document.getElementById("htmlRoot").lang=l;
    document.getElementById("pageTitle").textContent=L.title;
    document.getElementById("metaDesc").setAttribute("content",L.desc);
    Object.keys(L.btn).forEach(function(id){
      var el=document.getElementById(id); if(el) el.textContent=L.btn[id];
    });
    var info=document.getElementById("info-text"); if(info) info.innerHTML=L.info;
    var rl=document.getElementById("btn-rot-left");  if(rl) rl.title=L.rotL;
    var rr=document.getElementById("btn-rot-right"); if(rr) rr.title=L.rotR;
    var t=document.getElementById("langToggle"); if(t) t.textContent=L.toggleTo;
  }
  var t=document.getElementById("langToggle");
  /* iframe埋め込み時はトグルを出さない(親ページ側のトグルに従う) */
  if (window.self === window.top) {
    t.hidden=false;
    t.onclick=function(){
      var n=(cur()==="ja")?"en":"ja";
      localStorage.setItem("lang",n);
      render(n);
    };
  }
  /* 親ページで切り替えられたら追随する(same-originなのでstorageイベントが届く) */
  window.addEventListener("storage",function(e){ if(e.key==="lang") render(cur()); });
  render(cur());
})();
</script>
