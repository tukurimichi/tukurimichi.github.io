<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Cute Robot Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #2b394a 0%, #0d131a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.6;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      pointer-events: none;
    }
    #ui b {
      color: #ff8c32;
    }
  </style>
  <!-- Three.js & OrbitControls CDN -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui">
    🖱️ <b>左ドラッグ</b>: 360度回転<br>
    🔍 <b>ホイール</b>: ズームイン / アウト<br>
    🖐️ <b>右ドラッグ</b>: 平行移動 (パン)
  </div>

  <script>
    // --- シーン・カメラ・レンダラー ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // --- OrbitControls (3D回転・操作) ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.2, 0);

    // --- ライティング ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xfff5ea, 1.5);
    mainLight.position.set(5, 8, 5);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.bias = -0.0001;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x70a1ff, 0.8);
    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    // --- マテリアル定義 ---
    const orangeMat = new THREE.MeshStandardMaterial({
      color: 0xff6b22,
      roughness: 0.25,
      metalness: 0.15
    });

    const whiteMat = new THREE.MeshStandardMaterial({
      color: 0xf0f2f5,
      roughness: 0.2,
      metalness: 0.05
    });

    const jointMat = new THREE.MeshStandardMaterial({
      color: 0x4a4f57,
      roughness: 0.4,
      metalness: 0.8
    });

    const screenMat = new THREE.MeshStandardMaterial({
      color: 0x15181e,
      roughness: 0.1,
      metalness: 0.3
    });

    const eyeMat = new THREE.MeshBasicMaterial({
      color: 0xffb703
    });

    // --- ロボット全体のグループ ---
    const robot = new THREE.Group();
    scene.add(robot);

    // 1. 台座（Display Stand）
    const baseGeo = new THREE.CylinderGeometry(2.2, 2.4, 0.2, 64);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.5, metalness: 0.3 });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.1;
    baseMesh.receiveShadow = true;
    scene.add(baseMesh);

    // 2. 頭部（Head）
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 2.3, 0);
    robot.add(headGroup);

    // オレンジの外装シェル
    const headShellGeo = new THREE.BoxGeometry(1.6, 1.3, 1.2);
    const headShell = new THREE.Mesh(headShellGeo, orangeMat);
    headShell.castShadow = true;
    headGroup.add(headShell);

    // 白い前面ベゼル
    const bezelGeo = new THREE.BoxGeometry(1.4, 1.1, 0.2);
    const bezel = new THREE.Mesh(bezelGeo, whiteMat);
    bezel.position.set(0, 0, 0.55);
    headGroup.add(bezel);

    // モニタースクリーン
    const screenGeo = new THREE.PlaneGeometry(1.2, 0.9);
    const screen = new THREE.Mesh(screenGeo, screenMat);
    screen.position.set(0, 0, 0.66);
    headGroup.add(screen);

    // 発光する両目
    const eyeGeo = new THREE.CircleGeometry(0.12, 32);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.32, 0.05, 0.67);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.32, 0.05, 0.67);
    headGroup.add(leftEye, rightEye);

    // アンテナ
    const antPoleGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.35, 16);
    const antPole = new THREE.Mesh(antPoleGeo, jointMat);
    antPole.position.set(0.45, 0.8, 0);
    antPole.rotation.z = -0.2;
    const antTipGeo = new THREE.SphereGeometry(0.07, 16, 16);
    const antTip = new THREE.Mesh(antTipGeo, orangeMat);
    antTip.position.set(0.52, 0.98, 0);
    headGroup.add(antPole, antTip);

    // 耳パーツ（イヤーキャップ）
    const earGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.15, 32);
    const leftEar = new THREE.Mesh(earGeo, jointMat);
    leftEar.rotation.z = Math.PI / 2;
    leftEar.position.set(-0.85, 0, 0);
    const rightEar = leftEar.clone();
    rightEar.position.x = 0.85;
    headGroup.add(leftEar, rightEar);

    // 首関節
    const neckGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.25, 32);
    const neck = new THREE.Mesh(neckGeo, jointMat);
    neck.position.set(0, 1.6, 0);
    robot.add(neck);

    // 3. 胴体（Body / Chest）
    const chestGeo = new THREE.BoxGeometry(1.1, 0.85, 0.8);
    const chest = new THREE.Mesh(chestGeo, whiteMat);
    chest.position.set(0, 1.25, 0);
    chest.castShadow = true;
    robot.add(chest);

    // 胸のオレンジ装飾プレート
    const chestPlateGeo = new THREE.BoxGeometry(0.7, 0.5, 0.15);
    const chestPlate = new THREE.Mesh(chestPlateGeo, orangeMat);
    chestPlate.position.set(0, 1.35, 0.4);
    robot.add(chestPlate);

    // 腰（Pelvis）
    const pelvisGeo = new THREE.CylinderGeometry(0.4, 0.35, 0.3, 32);
    const pelvis = new THREE.Mesh(pelvisGeo, jointMat);
    pelvis.position.set(0, 0.72, 0);
    robot.add(pelvis);

    // 4. 腕部（Arms）
    function createArm(isLeft) {
      const side = isLeft ? -1 : 1;
      const arm = new THREE.Group();

      // 肩
      const shoulderGeo = new THREE.SphereGeometry(0.22, 32, 32);
      const shoulder = new THREE.Mesh(shoulderGeo, whiteMat);
      shoulder.position.set(side * 0.75, 1.45, 0);
      arm.add(shoulder);

      // 上腕
      const upperArmGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.35, 16);
      const upperArm = new THREE.Mesh(upperArmGeo, jointMat);
      upperArm.position.set(side * 0.82, 1.2, 0);
      upperArm.rotation.z = side * -0.2;
      arm.add(upperArm);

      // 前腕ガントレット（オレンジ）
      const foreArmGeo = new THREE.BoxGeometry(0.35, 0.45, 0.4);
      const foreArm = new THREE.Mesh(foreArmGeo, orangeMat);
      foreArm.position.set(side * 0.92, 0.85, 0.1);
      foreArm.castShadow = true;
      arm.add(foreArm);

      // 手（Hand）
      const handGeo = new THREE.BoxGeometry(0.2, 0.25, 0.25);
      const hand = new THREE.Mesh(handGeo, jointMat);
      hand.position.set(side * 0.92, 0.55, 0.1);
      arm.add(hand);

      return arm;
    }
    robot.add(createArm(true), createArm(false));

    // 5. 脚部・足（Legs & Feet）
    function createLeg(isLeft) {
      const side = isLeft ? -1 : 1;
      const leg = new THREE.Group();

      // 股関節
      const hipGeo = new THREE.SphereGeometry(0.15, 16, 16);
      const hip = new THREE.Mesh(hipGeo, jointMat);
      hip.position.set(side * 0.35, 0.6, 0);
      leg.add(hip);

      // 大腿部アーマー（オレンジ）
      const thighGeo = new THREE.BoxGeometry(0.42, 0.5, 0.45);
      const thigh = new THREE.Mesh(thighGeo, orangeMat);
      thigh.position.set(side * 0.4, 0.35, 0);
      thigh.castShadow = true;
      leg.add(thigh);

      // 足・ブーツ（Boots）
      const footGeo = new THREE.BoxGeometry(0.55, 0.25, 0.8);
      const foot = new THREE.Mesh(footGeo, orangeMat);
      foot.position.set(side * 0.42, 0.12, 0.1);
      foot.castShadow = true;
      leg.add(foot);

      // 靴底（ソール）
      const soleGeo = new THREE.BoxGeometry(0.57, 0.08, 0.82);
      const sole = new THREE.Mesh(soleGeo, jointMat);
      sole.position.set(side * 0.42, 0.04, 0.1);
      leg.add(sole);

      return leg;
    }
    robot.add(createLeg(true), createLeg(false));

    // 全オブジェクトに影の設定を一括適用
    robot.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // --- アニメーションループ ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // 自然な呼吸のような待機モーション（Idle Animation）
      robot.position.y = Math.sin(t * 2.0) * 0.04;
      headGroup.rotation.y = Math.sin(t * 1.0) * 0.1;
      headGroup.rotation.x = Math.sin(t * 1.5) * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- リサイズ ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
