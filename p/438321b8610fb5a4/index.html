<!doctype html>
<html lang="ja">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>町おこし商会</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 作り：スクロールなしの1画面。上の帯（季節・お金・冬の備え・余り）／つぎにやること／3Dの盤面／中身の欄／下の帯（建物・人）。
   細かい数字・地方・できごとは引き出し（メニュー）。地方の地図・支店長えらび・おわりは、前面の1枚（.sheet） */
:root{
  --bg:#eef1ec; --panel:#fbfcf9; --ink:#1d2b2a; --muted:#5d6b68; --line:#cfd6cf;
  --accent:#2b4a8b; --accent-ink:#ffffff; --accent-soft:#dfe6f5;
  --plain:#dfe8d2; --good:#23704a; --bad:#b03434; --warn:#8a5a00;
  --desk1:#f7f3ea; --desk2:#d9d0bf; --tint:#e3e9f7; --gold:#d8b545; --cold:#9fb6d6; --sel:#e8eefb;
  /* 地方の地図の小さな札の色 */
  --m-ground:#b9d98a; --m-river:#5aa5e2; --m-sea:#3d8ad2; --m-mount:#b3ad9f;
  --m-field:#e2c24e; --m-mill:#9a6337; --m-bake:#d9783a; --m-house:#5b7fc7;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1c2423; --ink:#e6ece8; --muted:#9aa8a4; --line:#34413e;
  --accent:#9db8ff; --accent-ink:#0e1524; --accent-soft:#26324d;
  --plain:#2b3a2c; --good:#74d49c; --bad:#ff8f86; --warn:#e9b765;
  --desk1:#3a3f44; --desk2:#22262a; --tint:#232c44; --gold:#d8b545; --cold:#5f7ba6; --sel:#26314d;
  --m-ground:#3b5a34; --m-river:#3476b0; --m-sea:#285f96; --m-mount:#6b675e;
  --m-field:#b0952f; --m-mill:#8a5a34; --m-bake:#c06a2e; --m-house:#5576bd; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1c2423; --ink:#e6ece8; --muted:#9aa8a4; --line:#34413e;
  --accent:#9db8ff; --accent-ink:#0e1524; --accent-soft:#26324d;
  --plain:#2b3a2c; --good:#74d49c; --bad:#ff8f86; --warn:#e9b765;
  --desk1:#3a3f44; --desk2:#22262a; --tint:#232c44; --gold:#d8b545; --cold:#5f7ba6; --sel:#26314d;
  --m-ground:#3b5a34; --m-river:#3476b0; --m-sea:#285f96; --m-mount:#6b675e;
  --m-field:#b0952f; --m-mill:#8a5a34; --m-bake:#c06a2e; --m-house:#5576bd; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 画面全体。ページはスクロールさせない */
.app{position:fixed;inset:0;margin:0 auto;max-width:480px;display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}

/* パソコンなど広い画面では、洋平さんのスマホ（Pixel 9 Pro＝412×915）と同じ大きさの枠で出す（スマホで見える形のまま確かめられるように） */
@media (min-width:600px){ .app{max-width:412px;height:min(100dvh,915px);margin:auto;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(20,30,40,.18)}
  .sheet.map{display:flex} .sheet.map .mapv{width:100%;max-width:412px;height:min(100%,915px);margin:auto;border:1px solid var(--line);border-radius:14px;overflow:hidden} }
/* 上の帯 */
.top{flex:none;display:grid;gap:5px;padding:calc(6px + env(safe-area-inset-top, 0px)) 10px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.r1{display:flex;align-items:center;gap:8px}
.when{flex:1;min-width:0}
.when .l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.when .l1 b{font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis}
.when .l1 span{font-size:12px;font-weight:700;color:var(--muted)}
.when .l2{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.when .l2 .pp{color:var(--ink);font-weight:900}
.yb{flex:1;min-width:24px;position:relative;display:flex;height:6px;border-radius:99px;overflow:hidden}   /* 1年の帯：暖かい季節｜冬。黒い印が今 */
.yb .w{background:var(--gold)} .yb .s{background:var(--cold)}
.yb i{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ink)}
.time{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.time button{width:32px;height:36px;border:0;background:transparent;display:grid;place-items:center}
.time button svg{fill:currentColor}
.time button.on{background:var(--accent);color:var(--accent-ink)}
.menu{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:grid;place-items:center}
.r2{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:6px}
.st{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-height:30px;padding:4px 8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);white-space:nowrap;overflow:hidden}
.st span{font-size:11px;font-weight:700;color:var(--muted)}
.st b{font-size:15px;font-weight:900} .st b small{font-size:11px;font-weight:700}
.st b.long{font-size:13px}
.st em{font-style:normal;font-size:11px;font-weight:900;color:var(--good)} .st em.low{color:var(--bad)}
.st .plus{color:var(--good)} .st .minus{color:var(--bad)}
.r3{display:flex;justify-content:space-between;gap:8px;margin-top:4px;padding:3px 8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden}
.r3[hidden]{display:none} .r3 b{font-size:13px;font-weight:900;color:var(--ink)} .r3 .low,.r3 .low b{color:var(--bad)}
@media (max-width:350px){ .r2{gap:4px;grid-template-columns:.85fr 1.8fr 1.1fr} .st{padding:4px 6px;gap:2px} .st span{font-size:10px} .st b{font-size:14px} .st b small,.st em{font-size:10px} }

/* つぎにやること（押すと目標の一覧。町が仕上がったら地図へ） */
.nrow{flex:none;display:flex;align-items:stretch;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--tint)}
.next{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:38px;padding:2px 4px;border:0;border-radius:8px;background:transparent;text-align:left}
.next b{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next b span{font-weight:900;color:var(--accent)}
.next i{flex:none;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.next.go{background:var(--accent);color:var(--accent-ink);padding:2px 8px} .next.go b span,.next.go i{color:inherit}
/* 「地図」と「数字」は盤面の外に置く（盤面に重ねると、奥のかどのマスが押せなくなる） */
.sb{flex:none;min-width:46px;padding:2px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.sb.on{background:var(--accent);color:var(--accent-ink)}
#nums{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* 盤面：上の帯・中身の欄・下の帯を引いた残りを全部使う。背の高い画面では机の上にゆとりができ、低い画面では盤面の幅を詰める */
.mid{flex:1 1 0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,var(--desk1),var(--desk2))}
.stage{position:relative;flex:none;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.stage canvas{display:block;width:100%;height:100%;filter:saturate(1.16) contrast(1.04)}
.lab,.fx{position:absolute;inset:0;pointer-events:none}
/* 数字の札はふだん出さない。出すのは「押したマス」「数字を押している間」「建てる・人をつける相手を選んでいる間の手がかり」 */
.lab span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;font-size:12px;line-height:1.5;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.96);color:#1d2b2a;box-shadow:0 1px 4px rgba(20,30,40,.4);opacity:0;transition:opacity .12s}
.lab span.on,.stage.nums .lab span{opacity:1}
.lab span.bad{color:#b03434}
.lab span.den{background:#ffe2b8;box-shadow:0 0 0 2px #d8453a,0 1px 4px rgba(20,30,40,.4)}   /* こんだ区画（火事が燃え広がる） */
.lab svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.lab polygon{fill:#e0362c;fill-opacity:0;stroke:#b3261e;stroke-opacity:0;stroke-width:1;transition:fill-opacity .12s}
.stage.nums .lab polygon,.lab polygon.on{fill-opacity:.4;stroke-opacity:.9}
.stage.nums .lab polygon.pre,.lab polygon.pre{fill:#ffd66b;stroke:#fff;stroke-width:2.5;stroke-opacity:1;fill-opacity:.85;transition:none;animation:prebl .7s steps(1,end) infinite}
.lab span.pre{opacity:1;transform:translate(-50%,-190%);background:#ffd66b;color:#1d2b2a;font-size:12px;font-weight:900;border:1.5px solid #fff;animation:prebl2 .7s steps(1,end) infinite}
.lab polygon.g1,.lab polygon.g2,.lab polygon.g3,.stage.nums .lab polygon.g1,.stage.nums .lab polygon.g2,.stage.nums .lab polygon.g3{fill:#ffcf3a;stroke:#fff3c2;stroke-width:1;stroke-opacity:.5}
.lab polygon.g1,.stage.nums .lab polygon.g1{fill-opacity:.22} .lab polygon.g2,.stage.nums .lab polygon.g2{fill-opacity:.4} .lab polygon.g3,.stage.nums .lab polygon.g3{fill-opacity:.6}
.lab polygon.bd,.stage.nums .lab polygon.bd{fill:#4d5661;fill-opacity:.5;stroke-opacity:0}
.lab span.pre{white-space:pre;text-align:center;border-radius:12px;padding:2px 9px;line-height:1.45} .lab span.pre.warnp{background:#f0c8c0;color:#8a2a22}
.lab polygon.rc,.stage.nums .lab polygon.rc{fill:#ffcf2e;fill-opacity:.55;stroke:#ffe27a;stroke-width:2;stroke-opacity:1;animation:prebl 1.6s ease-in-out infinite}
@keyframes prebl{50%{fill-opacity:.25}}@keyframes prebl2{50%{opacity:.45}}
.lab span.tag{transform:translate(-50%,-165%);background:#2b4a8b;color:#fff;font-size:10px;font-weight:900}
.lab span.tag.away{background:#7b8683}
.lab span.warn{opacity:1;width:17px;height:17px;padding:0;text-align:center;line-height:15px;font-size:12px;font-weight:900;background:#d8453a;color:#fff;border:1.5px solid #fff}
.lab span.hint{opacity:1;background:#2b4a8b;color:#fff;font-size:11px;font-weight:900} .lab span.hint.bad{background:#b03434;color:#fff}
.lab span.plot{background:#fff;color:#1d2b2a;font-size:11px;font-weight:900;border:1.5px solid #2b4a8b}
.lab span.can{opacity:1;width:14px;height:14px;padding:0;background:#ffd66b;border:2px solid #fff}
.err{padding:24px;font-size:14px}
.pop{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:900;font-size:13px;color:#1d2b2a;background:#fbfcf9;border:1px solid #cfd6cf;border-radius:5px;padding:1px 6px;animation:rise 1.6s ease-out forwards}
.pop.good{color:#23704a;border-color:#23704a} .pop.bad{color:#b03434;border-color:#b03434}
@keyframes rise{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-26px}}
.dot{position:absolute;width:11px;height:11px;border-radius:50%;margin:-5px 0 0 -5px;background:#e8c14a;border:1.5px solid #5a3d24;box-shadow:0 1px 2px rgba(20,30,40,.4);transition:left .9s linear,top .9s linear}
.dot.d-f{background:#fffaf0} .dot.d-b{background:#c98845}
@media (prefers-reduced-motion:reduce){ .dot{display:none} .pop{animation-duration:2.2s} }
.toast{position:absolute;left:0;right:0;bottom:8px;z-index:5;display:flex;justify-content:center;pointer-events:none;padding:0 10px}
.toast div{background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;max-width:100%;box-shadow:0 4px 14px rgba(20,30,40,.3)}

/* 盤面の見え方のボタン：回す（左）・もとに戻す・縮小と拡大（右）。盤面には重ねない */
.cbar{flex:none;display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--desk2);border-top:1px solid var(--line)}
.cbar span{flex:1}
.cbar button{min-width:44px;height:32px;padding:0 8px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
/* 中身の欄：押したマス／選んだ建物／選んだ人。盤面のすぐ下で、場所を動かさない */
.ctx{flex:0 0 clamp(132px,27vh,240px);min-height:0;overflow-y:auto;padding:9px 14px 8px;background:var(--panel);border-top:1px solid var(--line)}
.ctx .hd{display:flex;align-items:center;gap:8px;min-height:30px}
.ctx .hd svg{flex:none}
.ctx .hd b{font-size:16px;font-weight:900;white-space:nowrap}
.ctx .hd em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.ctx .hd .sk{font-size:13px;font-weight:900;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .hd .x{flex:none;margin-left:auto;min-height:32px;padding:2px 12px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.ctx p{margin:2px 0 0;font-size:13px}
.ctx p.do{font-weight:900;color:var(--accent)}
.ctx p.no{font-weight:900;color:var(--bad)}
.ctx p.sub{color:var(--muted);font-size:12px}
.ctx p.hint{font-size:14px;font-weight:700;margin-top:4px}
.ctx ul{margin:2px 0 0;padding-left:1.2em;font-size:13px;line-height:1.45}
.ctx .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.ctx .btns button{min-height:38px;padding:4px 14px;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ctx .btns button.danger{color:var(--bad);border-color:var(--bad)}
.ctx li button.lk{display:inline-block;padding:3px 11px;margin-left:4px;font-size:12px;font-weight:700;line-height:1.3;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:inherit}

/* 下の帯：建物｜人。選んでからマスを押す */
.dock{flex:none;display:flex;align-items:stretch;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));background:var(--panel);border-top:1px solid var(--line)}
.dock button{position:relative;min-width:0;height:56px;padding:2px 0 1px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;justify-items:center;align-content:center;gap:0;line-height:1.2}
/* 建物は横に送れる（増えても1画面のまま）。人は右に固定 */
.dock .tools{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:3px;margin-top:-3px} .dock .tools::-webkit-scrollbar{display:none}
.dock .tool{flex:1 0 46px} .dock .who{flex:0 0 42px}   /* 5つめが少しのぞく幅（まだあると分かるように） */
.dock b{font-size:11px;font-weight:900;white-space:nowrap}
.dock small{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.dock button.on{border:2px solid var(--accent);background:var(--sel);transform:translateY(-3px);box-shadow:0 4px 10px rgba(20,30,40,.2)}
.dock .tool.short svg,.dock .tool.short b{opacity:.42} .dock .tool.short small{color:var(--bad)}
.dock .sep{flex:none;width:1px;margin:6px 2px;background:var(--line)}
.dock .who small.free{color:var(--warn);font-weight:900}

/* 引き出し（目標・メニュー）。中だけスクロールしてよい */
.drawer{position:absolute;inset:0;z-index:15;display:flex;align-items:flex-end;background:rgba(15,22,28,.45)}
.drawer .in{width:100%;max-height:84%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom, 0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.drawer .sh{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.drawer h2{font-size:16px;font-weight:900;margin:0}
.drawer .sh button{min-height:40px;padding:4px 16px;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.drawer h3{font-size:12px;font-weight:900;color:var(--muted);margin:12px 0 4px}
.drawer p{font-size:13px;margin:0}
.goal{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 12px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;font-weight:700}
.goal small{font-size:11px;font-weight:500;color:var(--muted)}
.goal em{flex:none;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.goal.done{border-color:var(--good)} .goal.done em{color:var(--good);font-weight:900}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid5 div{padding:4px 6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
.grid5 span{display:block;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.grid5 b{font-size:14px;font-weight:900;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.flow em{font-style:normal;font-weight:700;color:var(--ink);padding:2px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.flow em.plus{color:var(--good);border-color:var(--good)} .flow em.minus{color:var(--bad);border-color:var(--bad)}
.flow em.thin{color:var(--bad);border-color:var(--bad)}
.drawer .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.drawer .row button{min-height:42px;padding:4px 14px;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.drawer ul.log{margin:0;padding-left:1.2em;font-size:13px}
.others{display:flex;flex-direction:column;gap:6px}
.other{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;min-width:0}
.other.me{border-color:var(--accent)}
.other span{font-size:12px;color:var(--muted)}

/* 前面の1枚：地方の地図・支店長えらび・おわり（前の版のまま） */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);overflow:auto;z-index:20;
  padding:calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet .in{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.sheet h1{margin:0 0 6px;font-size:22px;font-weight:900;text-wrap:balance}
.sheet .lead{margin:0 0 14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{margin:0;font-size:18px} .card h3 i{font-style:normal;font-size:13px;color:var(--accent);margin-left:6px}
.card p{margin:0;font-size:13px} .card .k{font-weight:700;color:var(--muted);font-size:12px;display:block}
.card button{margin-top:auto;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:900;padding:10px}
.card button.sure{background:var(--bad);color:var(--panel)}
.plain{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 14px}
.sheet .in.wide{max-width:980px}

function rentPlan(T,lv){const keep=T.rentLv;T.rentLv=lv;let yen=0,pop=0;try{for(let i=0;i<N;i++){const c=T.grid[i];if(!c||!isHome(c.k))continue;const q=liveCap(T,i);pop+=q;if(c.k==='jutaku'&&!c.sold)yen+=q*RENT*learnMul(T,i)*RENTLV[lv].m;}}finally{if(keep==null)delete T.rentLv;else T.rentLv=keep;}return {yen:Math.round(yen),pop};}

const WANT={after:2,max:5,warn:1,leave:15};
// 欲の年（yrW）：遊ぶ人がその町にいた時間だけで数える。離れているあいだは進まない（17回目の会議の手当て。洋平さん 2026-11-18「止める」）
const yrW=T=>Math.floor((T.t-(T.frozen||0))/(LANDS[T.land].warm+LANDS[T.land].winter));   // 村になってからの年数／始めてからの年数／知らせる年数／1人出ていくまでの秒
const wantY=T=>Math.min(T.doneY!=null?T.doneY+WANT.after:1e9,WANT.max),wantOn=T=>yrW(T)>=wantY(T),wantSoon=T=>yrW(T)>=wantY(T)-WANT.warn;
const unmet=(T,i)=>wantOn(T)&&!nearPlaza(T,i),liveCap=(T,i)=>{const c=T.grid[i],cap=houseCap(T,i),R=c&&c.k==='jutaku'&&!c.sold?RENTLV[rentLv(T)]:RENTLV[1];return Math.max(HN,Math.min(cap,Math.floor((cap-(unmet(T,i)?HN:0)-(unmet2(T,i)?HN:0)-(unmet3a(T,i)?HN:0)-(unmet3b(T,i)?HN:0))*R.k/HN+1e-9)*HN+R.d*HN));};   // 住みたい人数（定員 houseCap はそのまま）

// 欲の分岐：神社の欲が始まって WANT2.after 年たつと「買い物がしたい（朝市）」と「学びたい（寺子屋）」が同時に来る。まわり3マスにどちらも無い家は10人出ていく。

const WANT2={after:2,warn:1,r:3,shop:.2,edu:.05,eduMax:.3,line:.5,rent:.08,rentMax:.48};   // rent：寺子屋が届く長屋の家賃と時価が、学び1年ごとに上がる割合と上限

const SAKA={per:60,r:3,price:.3,pr:2,chian:10},BAN={chian:10},FIRE={grace:3,base:.05,saka:.2,dense:9,max:8,den:.1};

const isKyo=T=>kyoYears(T).includes(yrOf(T)),kyoSoon=T=>kyoYears(T).includes(yrOf(T)+1),kyoPick=T=>T.kyo&&T.kyo.y===yrOf(T)?T.kyo.p:null;

function kyoChoose(p){const T=cur();if(!T.kyo||T.kyo.p!=null||!(p>=0&&p<=2))return;T.kyo.p=p;const c0=chianOf(T);T.chian=Math.max(0,Math.min(100,c0+KYO.ch[p]));
  if(p===1)T.fame=Math.min(KYO.fameMax,(T.fame||0)+1);
  say(['凶作の年：米を高値のまま売ることにしました。','凶作の年：お救い米を出しました。町の評判が上がりました（'+(T.fame||0)+'）。','凶作の年：米をしぼって売ることにしました。'][p]+' 治安 '+Math.round(c0)+' → '+Math.round(T.chian),false);
  if(S.phase==='kyo')S.phase='town';S.sure=null;beep(p===1?660:440,.12);dirty=true;save();}
function tsumiToggle(){const T=cur();T.tsumiOn=!T.tsumiOn;banner(T.tsumiOn?'春ごとに積み立てます（1人1石ぶん）':'積み立てをやめました（積んだ米は残ります）');dirty=true;save();}
const active=g=>!!g&&!g.off&&(g.bad||0)<3;
const popNear=(T,i,d)=>{const r=Math.floor(i/W),c=i%W;let n=0;for(let y=Math.max(0,r-d);y<=Math.min(W-1,r+d);y++)for(let x=Math.max(0,c-d);x<=Math.min(W-1,c+d);x++){const g=T.grid[y*W+x];if(g&&isHome(g.k))n+=g.pop;}return n;};
const sakaBase=(T,i)=>popNear(T,i,SAKA.r)*SAKA.per/120;   // 万円／秒
const nearSaka=(T,i)=>{const r=Math.floor(i/W),c=i%W,R=SAKA.pr;for(let y=Math.max(0,r-R);y<=Math.min(W-1,r+R);y++)for(let x=Math.max(0,c-R);x<=Math.min(W-1,c+R);x++){const g=T.grid[y*W+x];if(g&&g.k==='sakariba')return true;}return false;};
const guarded=(T,i)=>nearK(T,i,'hikeshi');
// 火除け地：火は上下左右の建物へ燃え移る（最大 FIRE.max 軒）。空き地・田・綿畑・神社では止まる。建物が FIRE.dense 軒以上つながった「こんだ区画」は、火が出やすく、火消しでも止めきれない
const burns=c=>!!c&&c.k!=='hatake'&&c.k!=='bokujo'&&c.k!=='hiroba';
function fireBlock(T,i){if(!burns(T.grid[i]))return [];const seen=new Set([i]),q=[i];for(let h=0;h<q.length;h++)for(const j of nb(q[h]))if(!seen.has(j)&&burns(T.grid[j])){seen.add(j);q.push(j);}return q;}
function denseMax(T){let m=0;const seen=new Set();for(let i=0;i<N;i++){if(seen.has(i)||!burns(T.grid[i]))continue;const b=fireBlock(T,i);for(const j of b)seen.add(j);if(b.length>m)m=b.length;}return m;}
const fireChance=T=>{let n=0,u=0;for(let i=0;i<N;i++){const c=T.grid[i];if(c&&c.k==='sakariba'){n++;if(!guarded(T,i))u++;}}return FIRE.base+FIRE.saka*u+FIRE.saka*.2*(n-u)+(denseMax(T)>=FIRE.dense?FIRE.den:0);};
function fire(T,ev){const y=yrOf(T);if(y<FIRE.grace||rnd(T.land*31.7+y*7.3,5)>=fireChance(T))return;
  const sk=[],all=[];for(let i=0;i<N;i++){const c=T.grid[i];if(!c)continue;if(c.k==='sakariba')sk.push(i);if(c.k!=='hatake'&&c.k!=='bokujo')all.push(i);}
  let cand=all;if(sk.length){const s0=sk[Math.floor(rnd(y,6+T.land)*sk.length)],r=Math.floor(s0/W),c=s0%W;cand=all.filter(j=>Math.abs(Math.floor(j/W)-r)<=1&&Math.abs(j%W-c)<=1);}
  if(!cand.length)return;const i=cand[Math.floor(rnd(y*3.1+T.land,7)*cand.length)],k=T.grid[i].k;
  const isG=j=>guarded(T,j)||T.grid[j].k==='hikeshi',g0=isG(i),dense=fireBlock(T,i).length>=FIRE.dense;
  if(g0&&!dense){ev.push({e:'boya',i,k});return;}
  const lim=!burns(T.grid[i])?1:dense&&g0?Math.ceil(FIRE.max/2):FIRE.max,out=[],seen=new Set([i]),q=[i];
  for(let h=0;h<q.length&&out.length<lim;h++){const j=q[h];out.push(j);if(burns(T.grid[j]))for(const n of nb(j))if(!seen.has(n)&&burns(T.grid[n])){seen.add(n);if(dense||!isG(n))q.push(n);}}
  for(const j of out)T.grid[j]=null;fixCaps(T);T.burnt=(T.burnt||0)+out.length;ev.push({e:'fire',i,k,is:out,dense,half:dense&&g0});}
const charOf=T=>(shopShare(T)>=WANT2.line?'商':'')+(schoolShare(T)>=WANT2.line?'学':'');
const canBuild=(T,k)=>!UNLOCK[k]||rankOf(T)>=UNLOCK[k]||(k==='hiroba'&&wantSoon(T))||((k==='ichiba'||k==='terakoya')&&want2Soon(T));   // 神社は、欲の知らせが出たら村でなくても建てられる（資金がまだ無いので会社のお金で）
function wantLeave(T){let b=-1,bs=0;for(let i=0;i<N;i++){const c=T.grid[i];if(!c||!isHome(c.k)||c.pop<=liveCap(T,i))continue;const sc=siteScore(T,i);if(b<0||sc<bs){b=i;bs=sc;}}
  if(b>=0)T.grid[b].pop-=HN;return b;}
const cycle=T=>LANDS[T.land].warm+LANDS[T.land].winter;
const isWinter=T=>(T.t%cycle(T))>=LANDS[T.land].warm;
const fieldBase=(T,i)=>1.25*soilOf(T,i)*(wet(T,i)?1.5:1)*(T.grid[i]&&T.grid[i].up?UPG.ta.mul:1);
const millBase=(T,i)=>12.5*LANDS[T.land].mill*(1+.25*adj(T,i,'hatake'));
const bakeBase=(T,i)=>12.5*(1+.25*guests(T,i));

function calc(T){
  const L=LANDS[T.land],win=isWinter(T);
  let pop=0,need=0,ww=0,wwin=0,mill=0,bake=0,ew=0,ewin=0,wool=0,mkt=0,saka=0;
  for(let i=0;i<N;i++){const c=T.grid[i];if(!c)continue;
    if(isHome(c.k)){pop+=c.pop;ew+=c.pop*EAT;ewin+=c.pop*EAT*(yukiCover(T,i)?1:L.eat);}
    else{need+=cb(T,i,'take')?0:B[c.k].need;
      if(c.k==='hatake'){const r=fieldBase(T,i);ww+=r;if(genCover(T,i))wwin+=r*.5;}
      else if(c.k==='seifun')mill+=millBase(T,i);
      else if(c.k==='panya')bake+=bakeBase(T,i);
      else if(c.k==='bokujo')wool+=pastBase(T,i);
      else if(c.k==='ichiba')mkt+=mktBase(T,i);
      else if(c.k==='sakariba')saka+=sakaBase(T,i);}
  }
  const eff=need>0?Math.min(1,pop/need):1;
  const em=eduMul(T);ww*=eff*em;wwin*=eff*em;if(isKyo(T)){ww*=KYO.yield;wwin*=KYO.yield;}mill*=eff*em;bake*=eff*em;wool*=eff;mkt*=eff;saka*=eff;
  const steady=Math.min(ww,mill,bake);
  return {saka,wool,mkt,pop,need,eff,win,ww,wwin,wheat:win?wwin:ww,mill,bake,ew,ewin,eat:win?ewin:ew,steady,surplus:(steady-ew)*60};
}
function prep(T){const L=LANDS[T.land],c=calc(T),win=c.win;
  const left=win?cycle(T)-(T.t%cycle(T)):L.winter;
  return {need:c.ewin*left,have:T.bread+T.flour+T.wheat+c.wwin*left,left,win};}
function yearNet(T){const L=LANDS[T.land],c=calc(T);return c.steady*L.warm+Math.min(c.wwin,c.mill,c.bake)*L.winter-c.ew*L.warm-c.ewin*L.winter;}
function ifLeft(id){const T=JSON.parse(JSON.stringify(cur()));PRES=[id];try{fixCaps(T);const c=calc(T);return {year:yearNet(T),surplus:c.surplus,winter:Math.min(c.wwin,c.mill,c.bake)*60,pop:c.pop};}finally{PRES=null;}}
function fixCaps(T,ev){for(let i=0;i<N;i++){const c=T.grid[i];if(c&&isHome(c.k)){const cap=houseCap(T,i);
  if(c.pop>cap){c.pop=cap;ev&&ev.push({e:'noise',i});}}}}
function leaveOne(T){let b=-1,bs=0;for(let i=0;i<N;i++){const c=T.grid[i];if(!c||!isHome(c.k)||c.pop<=HN)continue;const sc=siteScore(T,i);if(b<0||sc<bs||(sc===bs&&c.pop>T.grid[b].pop)){b=i;bs=sc;}}
  if(b>=0)T.grid[b].pop-=HN;return b;}
function joinOne(T){let b=-1,bs=0;for(let i=0;i<N;i++){const c=T.grid[i];if(!c||!isHome(c.k)||c.pop>=liveCap(T,i))continue;const sc=siteScore(T,i);if(b<0||sc>bs||(sc===bs&&c.pop<T.grid[b].pop)){b=i;bs=sc;}}
  if(b>=0)T.grid[b].pop+=HN;return b;}

function step(T,dt,ev){
  T.t+=dt;const away=T!==cur();if(away)T.frozen=(T.frozen||0)+dt;
  if(isKyo(T)&&(!T.kyo||T.kyo.y!==yrOf(T))){const ts=Math.floor(T.tsumi||0);T.kyo={y:yrOf(T),p:null};if(ts>0){T.bread+=ts;T.tsumi=0;}ev.push({e:'kyo',tsumi:ts});}
  if(!away&&(wantOn(T)||rentLv(T)===2)){T.wantT=(T.wantT||0)+dt;if(T.wantT>=WANT.leave){T.wantT=0;const i=wantLeave(T);if(i>=0)ev.push({e:'want',i});}}
  for(let i=0;i<N;i++){const c=T.grid[i];if(c&&c.sale){c.sale.t+=dt;if(c.sale.t>=saleNeed(T,c)){const pr=sellPrice(T,i);S.money+=pr;c.sold=true;delete c.sale;ev.push({e:'sold',i,p:pr});}}}
  const win=isWinter(T);
  // 家賃は毎月（10秒ごと）に、年の額の12分の1ずつ入る。端数は次の月へ送る
  T.rentAcc=(T.rentAcc||0)+dt;while(T.rentAcc>=10){T.rentAcc-=10;const x=rentOf(T)/12+(T.rentRem||0),m=Math.floor(x);T.rentRem=x-m;if(m>0){S.money+=m;ev.push({e:'rent',m});}}
  if(win&&!T.wasWinter){T.wasWinter=true;T.winterClean=true;T.lostW=0;ev.push({e:'winterStart'});fire(T,ev);if(kyoSoon(T))ev.push({e:'kyoSoon'});}
  if(!win&&T.wasWinter){T.wasWinter=false;T.edu=(T.edu||0)+schoolShare(T);if(!away){const u=unmetShare(T),c0=chianOf(T);let nS=0,nB=0;for(const g of T.grid){if(g&&g.k==='sakariba')nS++;if(g&&g.k==='bansho'&&active(g))nB++;}T.chian=Math.max(0,Math.min(100,c0+(u>0?-CHIAN.down*u:nS>nB?0:CHIAN.up)-SAKA.chian*nS+BAN.chian*nB));if(T.chian!==c0)ev.push({e:'chian',from:c0,to:T.chian});}if(!T.denseTold&&denseMax(T)>=FIRE.dense){T.denseTold=true;ev.push({e:'dense',n:denseMax(T)});}if(T.winterClean)T.winters++;ev.push({e:'winterEnd',clean:T.winterClean,lost:T.lostW,rent:0});
    if(T.tsumiOn&&!isKyo(T)){const x=tsumiCost(T),add=calc(T).pop;if((T.tsumi||0)+add<=tsumiCap(T)&&S.money>=x){S.money-=x;T.tsumi=(T.tsumi||0)+add;ev.push({e:'tsumi',x,add});}}if(T.done)newYear(T,T.winterClean,ev);}
  const c=calc(T);
  T.wheat+=c.wheat*dt;
  const m=Math.min(c.mill*dt,T.wheat);T.wheat-=m;T.flour+=m;
  const b=Math.min(c.bake*dt,T.flour);T.flour-=b;T.bread+=b;
  const kp=kyoPick(T),want=c.eat*dt*(kp===2?KYO.ration:1),eat=Math.min(want,T.bread);
  T.bread-=eat;S.money+=eat*PRICE*LANDS[T.land].price*(1+shopGain(T))*(kp===0?KYO.price:kp===1?0:1);T.eatAcc+=eat;
  if(c.saka>0)S.money+=c.saka*dt;
  if(c.wool>0)S.money+=c.wool*dt*WOOL;                                                               // 木綿はとれたそばから売れる
  if(c.mkt>0){const p=prep(T),sell=Math.max(0,Math.min(c.mkt*dt,T.bread-20,p.have-p.need));T.bread-=sell;S.money+=sell*MKT*LANDS[T.land].price;}   // 朝市：冬の備えを残して、余った白米だけ売る
  if(want>0&&eat<want-1e-9){
    T.hungerT+=dt;
    if(T.hungerT>=10){T.hungerT=0;const i=leaveOne(T);
      if(win){T.winterClean=false;if(i>=0){T.lostW++;T.lostAll=(T.lostAll||0)+1;}}

    T.hungerT=Math.max(0,T.hungerT-dt);
    if(T.bread>50){T.growT+=dt;if(T.growT>=8*(1+CHIAN.join*(1-chianOf(T)/100))){T.growT=0;const i=joinOne(T);if(i>=0)ev.push({e:'back',i});}}
  }
}
function newYear(T,clean,ev){   // 年度がわり：余りは返して新しい資金が付き、公共の物の維持費を引く。払えなかった物は1段ずつ寂れる
  const grant=grantOf(T,clean),bad=[],kb=[],ix=[];let forced=0;T.yosan=grant;
  for(let i=0;i<N;i++){const c=T.grid[i];if(c&&KEEP[c.k]&&!c.off)ix.push(i);}
  ix.sort((a,b)=>(T.grid[a].k==='kouei'?0:1)-(T.grid[b].k==='kouei'?0:1)||a-b);   // 共同長屋が先（やめられないので）
  for(const i of ix){const c=T.grid[i],k=KEEP[c.k];
    if(T.yosan>=k){T.yosan-=k;c.bad=0;}
    else if(c.k==='kouei'){if(S.money>=k){S.money-=k;forced+=k;c.bad=0;}else{c.bad=Math.min(3,(c.bad||0)+1);kb.push(c.bad);}}   // 共同長屋は、資金で足りなければ会社の資産から払う
    else{c.bad=Math.min(3,(c.bad||0)+1);bad.push(c.bad);}}
  fixCaps(T);if(ev)ev.push({e:'year',grant,left:T.yosan,bad,kb,forced});}
function goals(T){const c=calc(T),G=LANDS[T.land].goal;
  const g=[{t:'冬を'+G.w+'回、白米を切らさずに越す',ok:T.winters>=G.w,now:'いま '+T.winters+'回'},
           {t:'人口 '+G.pop+'人以上',ok:c.pop>=G.pop,now:'いま '+c.pop+'人'}];
  if(G.sur)g.push({t:'白米の余り 半年で'+G.sur+'石以上',ok:c.surplus>=G.sur-1e-6,now:'いま '+sign(c.surplus)});
  return g;}
const sign=x=>(x>=0?'+':'−')+Math.abs(Math.round(x));
const UP=1.02;   // 同じ建物を建てるたびの値上がり（5%→2%。18回目の会議。仮）
const costOf=(T,k)=>Math.round(B[k].cost*Math.pow(UP,count(T,k)));
const AMT=[{n:'少なめ',k:1.5,d:'冬の分の1.5倍を残して、余りを送ります（送り元が安全）'},{n:'ふつう',k:1,d:'自分の冬の分を残して、余りを送ります'},{n:'多め',k:.5,d:'冬の分の半分だけ残して送ります（送り元の冬が足りなくなる恐れ）'}];
const amtOf=T=>T.route&&T.route.amt!=null?T.route.amt:1;
function led(T,d){if(!T||!d)return;const l=T.led||(T.led={i:0,o:0});if(d>0)l.i+=d;else l.o-=d;}
let ledDepth=0;const ledWrap=f=>function(){if(ledDepth)return f.apply(this,arguments);const T=cur(),m0=S.money;ledDepth++;try{return f.apply(this,arguments);}finally{ledDepth--;led(T,S.money-m0);}};
const ledLine=(l)=>'入り '+yenFix(Math.round(l.i)+'万円')+'・出 '+yenFix(Math.round(l.o)+'万円')+'＝<b class="'+(l.i-l.o<0?'low':'')+'">'+(l.i-l.o<0?'−':'＋')+yenFix(Math.abs(Math.round(l.i-l.o))+'万円')+'</b>';
function excess(T,good){const p=prep(T);return Math.floor(Math.min(T[good]-20,p.have-p.need*AMT[amtOf(T)].k));}

// ───────── 進める ─────────
function advance(dt,quiet){
  S.clock+=dt;
  const C=cur();
  for(const T of founded()){
    if(!T.started)continue;
    const ev=[],mine=T===C,nm=LANDS[T.land].n;
    {const m0=S.money;step(T,dt,ev);led(T,S.money-m0);}
    for(const e of ev){
      if(e.e==='kyoSoon'){dirty=true;say((mine?'':nm+'：')+'夏が寒く、稲の育ちがよくありません。来年は凶作になりそうです（田のとれ高が半分）。蔵の白米を増やしておきましょう。'+(T.tsumiOn?'':'メニューの「凶作への積み立て」を始めておくと、次の凶作から、春に蔵へ米が入ります。'),quiet);if(mine&&!quiet)beep(300,.2);}
      else if(e.e==='kyo'){dirty=true;say((mine?'':nm+'：')+'凶作の年です。今年は田のとれ高が半分になります。'+(e.tsumi?'積み立ての '+e.tsumi+'石を蔵に入れました。':''),quiet);}
      else if(e.e==='tsumi'){dirty=true;if(mine)say('積み立て：'+e.x+'万円で '+e.add+'石を積みました（いま '+Math.floor(T.tsumi)+'石）。',true);}
      else if(e.e==='winterStart'){if(mine)say('冬が来ました。田は休み'+(LANDS[T.land].eat>1?'、住民は'+LANDS[T.land].eat+'倍食べます。':'です。'),quiet);dirty=true;}
      else if(e.e==='winterEnd'){dirty=true;T.ledPrev=T.led||{i:0,o:0};T.led={i:0,o:0};
        const who=(T.chief?[T.chief]:[]).concat(mine?S.hand:[]);
        if(e.clean){for(const id of who)addHist(id,nm+'で冬を越した');
          if(mine){say('冬を越しました。'+(e.rent?'家賃 +'+e.rent+'万円。':''),quiet);if(!quiet){beep(660,.12);setTimeout(()=>beep(880,.18),130);}}
          else if(T.chief)say(P[T.chief].n+'（'+nm+'）より：冬を越しました。',true);}
        else if(mine)say('冬のあいだに白米が切れました'+(e.lost?'（'+e.lost+'人が出て行った）':'')+'。次の冬でもう一度。'+(e.rent?'家賃 +'+e.rent+'万円。':''),quiet);
        else say((T.chief?P[T.chief].n+'（'+nm+'）より：':nm+'：')+'冬に白米が切れました。'+(e.lost?e.lost+'人が町を出ました。':''),quiet);}
      else if(e.e==='year'){dirty=true;
        if(mine)say('新しい年度の資金 '+e.grant+'万円（維持費を引いて残り '+Math.floor(e.left)+'万円）。',quiet);   // よその町の分は、足りないときだけ知らせる
        if(e.bad.length){const w=Math.max.apply(null,e.bad);say((mine?'':nm+'：')+'維持費が足りない公共の建物が'+e.bad.length+'か所あります。'+(w>=3?'休止になりました。':w===2?'効き目が半分になりました。':'次の春も払えないと、効き目が半分になります。'),quiet);if(mine&&!quiet)beep(170,.2);}
        if(e.forced)say((mine?'':nm+'：')+'共同長屋の維持費が資金で足りず、会社の資産から'+e.forced+'万円払いました。',quiet);
        if(e.kb&&e.kb.length)say((mine?'':nm+'：')+'共同長屋'+e.kb.length+'軒の維持費が払えません。'+(Math.max.apply(null,e.kb)>=2?'10人しか住めなくなりました。':'次の春も払えないと、10人しか住めなくなります。'),quiet);}
      else if(e.e==='hungry'){dirty=true;
        if(mine&&!quiet){if(e.i>=0)popAt(e.i,'白米がない −10人','bad');beep(170,.2);}
        if(!T.hungryTold){T.hungryTold=true;say((mine?'':nm+'：')+'白米が足りず、住民が出て行き始めました。',quiet);}}
      else if(e.e==='back'){dirty=true;T.hungryTold=false;if(mine&&!quiet)popAt(e.i,'もどってきた +10人','good');}
      else if(e.e==='chian'){dirty=true;const a=Math.round(e.from),b=Math.round(e.to);
        if(b<a&&(a===100||Math.floor(b/25)!==Math.floor(a/25))){say((mine?'':nm+'：')+'治安が悪くなってきました（'+b+'）。欲を満たしていない家があるためです。長屋の時価が下がり、人が入りにくくなります。',quiet);if(mine&&!quiet)beep(170,.2);}
        else if(b>a&&b===100)say((mine?'':nm+'：')+'治安が元に戻りました。',quiet);}
      else if(e.e==='fire'){dirty=true;const is=e.is||[e.i];if(mine&&is.includes(S.sel))S.sel=null;

      else if(e.e==='boya'){dirty=true;say(nm+'の'+B[e.k].n+'でぼやが出ましたが、火消しが消し止めました。',quiet);if(mine&&!quiet)popAt(e.i,'ぼやで済んだ','good');}

    }
    if(mine&&T.grid.some(c=>c&&c.sale))dirty=true;   // 売却待ちのゲージを進める
    if(T.done&&T.doneY==null)T.doneY=yrW(T);   // 村になった年（欲が来る年を数える元）

    else if(wantOn(T)&&(T.wantTold||0)<2){T.wantTold=2;dirty=true;say((mine?'':nm+'：')+'住民が集まる場をほしがっています。神社が近くにない家から、10人ずつ出ていきます。',quiet);if(mine&&!quiet)beep(170,.2);}

    if(want3Soon(T)&&!T.want3Told){T.want3Told=1;dirty=true;say((mine?'':nm+'：')+'市の住民が、守りと楽しみをほしがり始めました。来年の春から、番所か火消しが近く（まわり3マス）にない家と、盛り場が近く（まわり3マス）にない家は、それぞれ10人出ていきます。',quiet);if(mine&&!quiet)beep(440,.15);}
    else if(want3On(T)&&(T.want3Told||0)<2){T.want3Told=2;dirty=true;say((mine?'':nm+'：')+'守り（番所か火消し）が近くにない家、楽しみ（盛り場）が近くにない家から、10人ずつ出ていきます。',quiet);if(mine&&!quiet)beep(170,.2);}
    if(want2Soon(T)&&!T.want2Told){T.want2Told=1;dirty=true;say((mine?'':nm+'：')+'住民が、買い物や学びの場をほしがり始めました。来年の春から、朝市か寺子屋が近く（まわり3マス）にない家は10人出ていきます。朝市と寺子屋を建てられるようになりました。',quiet);if(mine&&!quiet)beep(440,.15);}
    else if(want2On(T)&&(T.want2Told||0)<2){T.want2Told=2;dirty=true;say((mine?'':nm+'：')+'朝市も寺子屋も近くにない家から、10人ずつ出ていきます。',quiet);if(mine&&!quiet)beep(170,.2);}
    if(T.done&&T.yosan==null)T.yosan=grantOf(T,false);   // 村になったとき（と、資金の無かった続きを開いたとき）に最初の資金が付く
    if(T.done&&rankOf(T)<3){const pp=calc(T).pop,nr=pp>=RANKPOP[3]?3:pp>=RANKPOP[2]?2:1;
      if(nr>rankOf(T)){T.rank=nr;dirty=true;say(nm+'が「'+RANK[nr]+'」になりました。便で送れる量が'+(nr===3?4:2)+'倍になります。'+(nr===2?'長屋の家賃の高さ（安い・ふつう・高い）を変えられます。長屋を押して「家賃を変える」か、メニューから。':''),quiet);
        if(nr===3&&mine&&!quiet&&S.phase==='town'){S.phase='kugiri';S.tool=null;S.sel=null;S.sure=null;S.dr='';}   // 一区切りの知らせ（試験の早回しでは出さない）
if(!quiet){beep(660,.1);setTimeout(()=>beep(990,.2),120);}}}
    if(!T.done&&goals(T).every(g=>g.ok)){T.done=true;dirty=true;say(nm+'が「村」になりました。共同の資金が付きます。資金で神社と共同長屋を建てられます。'+(T.land===0?'人口'+RANKPOP[2]+'人で「町」になると、次の土地を開けます。':'地図から次の土地を開けます。'),quiet);if(!quiet){beep(660,.1);setTimeout(()=>beep(990,.2),120);}}
  }
  if(C.started&&C.kyo&&C.kyo.p==null&&isKyo(C)&&S.phase==='town'){if(quiet){if(S.kyoAuto!=null)kyoChoose(S.kyoAuto);}else{S.phase='kyo';S.tool=null;S.sel=null;S.sure=null;S.dr='';dirty=true;}}
  S.shipAcc+=dt;
  if(S.shipAcc>=10){S.shipAcc-=10;
    for(const T of founded()){T.last=0;const r=T.route,D=r&&S.towns[r.to];if(!D||!T.started)continue;
      const n=Math.min(shipOf(T),excess(T,r.good));
      if(n>0){T[r.good]-=n;D[r.good]+=n;T.sent+=n;D.got+=n;T.last=n;dirty=true;
        if(D===C&&!quiet)banner(LANDS[T.land].n+'から '+GOODS[r.good]+n+'石が届いた');}}}
  if(!quiet){while(C.eatAcc>=20){C.eatAcc-=20;const hs=[];C.grid.forEach((c,i)=>{if(c&&isHome(c.k)&&c.pop>0)hs.push(i);});
      if(hs.length&&Math.random()<.5)popAt(hs[Math.floor(Math.random()*hs.length)],'+'+Math.round(20*PRICE*LANDS[C.land].price)+'万円','');}}
  else C.eatAcc=0;
  if(S.loc===0)while(S.tip<TIPS.length&&TIPS[S.tip].ok(C)){if(!quiet){banner('できた：'+TIPS[S.tip].t.replace(/（.*）/,''));beep(740,.1);}S.tip++;dirty=true;}
  if(!S.ended&&S.towns.every(T=>T&&T.done)){S.ended=true;S.phase='end';S.paused=true;dirty=true;}
}
function addHist(id,line){const h=S.hist[id]||(S.hist[id]=[]);if(!h.includes(line)){h.push(line);dirty=true;}}
function say(t,quiet){S.log.unshift(t);S.log.length=Math.min(S.log.length,8);if(!quiet)banner(t);dirty=true;}

// ───────── 操作 ─────────
// ───────── 区画（4×4マスが1区画。16区画のうち、最初に使えるのはまんなかの4つ＝8×8マス。まわりの12こはお金で買う。数字は仮） ─────────
const blk=i=>Math.floor(Math.floor(i/W)/4)*4+Math.floor((i%W)/4);
const isOpen=(T,i)=>!T.open||T.open[blk(i)];
const plotCost=T=>Math.round(16000*Math.pow(1.4,T.open.filter(Boolean).length-4));   // 買うたびに4割ずつ高くなる
const canBuy=(T,b)=>!T.open[b]&&[[0,1],[0,-1],[1,0],[-1,0]].some(([dr,dc])=>{const r=Math.floor(b/4)+dr,c=b%4+dc;return r>=0&&r<4&&c>=0&&c<4&&T.open[r*4+c];});   // 買えるのは、持っている区画のとなりだけ
function buyPlot(b){const T=cur();if(!T.open||!canBuy(T,b))return false;const c=plotCost(T);
  if(S.money<c){banner('お金が足りません（あと'+Math.ceil(c-S.money)+'万円）');beep(170,.15);return false;}
  S.money-=c;T.open[b]=true;S.sel=null;say(LANDS[T.land].n+'の土地を広げました（'+T.open.filter(Boolean).length+'／16区画）。');beep(520,.1);dirty=true;save();return true;}
// 最初の手順のあいだの「おすすめの場所」：いまの手順で建てる物と、点の高い空き地（家はまんなか寄りで川と搗き屋から離す／田は川のとなり／搗き屋は田のとなり／米屋は家のとなり）
function recCells(T){if(S.loc!==0||T.land!==0||S.tip>=4)return null;const k=['jutaku','hatake','seifun','panya'][S.tip],f=[];
  for(let i=0;i<N;i++)if(!T.grid[i]&&terr(T,i)==='.'&&isOpen(T,i))f.push(i);
  const d=i=>Math.abs(Math.floor(i/W)-W/2+.5)+Math.abs(i%W-W/2+.5);
  const sc=i=>k==='jutaku'?-d(i)*.3-(riverAdj(T,i)?3:0)+adj(T,i,'jutaku')-adj(T,i,'hatake')*2-adj(T,i,'seifun')*5
    :k==='hatake'?(riverAdj(T,i)?5:0)-d(i)*.3-adj(T,i,'jutaku')*3+adj(T,i,'hatake')*.5
    :k==='seifun'?adj(T,i,'hatake')*3-adj(T,i,'jutaku')*6-d(i)*.1
    :adj(T,i,'jutaku')*3-adj(T,i,'hatake')-d(i)*.1;
  const v=new Map(f.map(i=>[i,sc(i)]));f.sort((a,b)=>v.get(b)-v.get(a));
  return {k,cells:f.slice(0,1)};}   // 候補は1つだけ（いくつも出すと、どこのことか分からない）
function place(i,k){
  const T=cur();if(T.grid[i]||terr(T,i)!=='.'||!isOpen(T,i))return false;
  if(!canBuild(T,k)){banner(B[k].n+'は、町が「'+RANK[UNLOCK[k]]+'」になると建てられます');return false;}
  const cost=costOf(T,k);
  if(isPub(k)&&T.done){const sh=Math.max(0,cost-Math.max(0,T.yosan||0));   // 共同の資金が足りない分は、会社のお金で払う
    if(S.money<sh){banner('共同の資金と会社のお金を合わせても足りません（あと'+Math.ceil(sh-S.money)+'万円）');beep(170,.15);return false;}
    payPub(T,cost);if(sh>0)banner('共同の資金が足りない分 '+Math.ceil(sh)+'万円を、会社のお金で払いました');}
  else{if(S.money<cost){banner('お金が足りません（あと'+Math.ceil(cost-S.money)+'万円）');beep(170,.15);return false;}S.money-=cost;}
  T.grid[i]={k,by:null};
  if(isHome(k))T.grid[i].pop=liveCap(T,i);
  if(k==='kouei')T.grid[i].y0=yrOf(T);
  if(!T.started){T.started=true;S.paused=false;}
  const ev=[];fixCaps(T,ev);
  if(k==='hatake'){if(riverAdj(T,i))popAt(i,'川のとなり ×1.5','good');else if(wet(T,i))popAt(i,'水みち ×1.5','good');
    nb(i).forEach(j=>{if(T.grid[j]&&T.grid[j].k==='seifun')popAt(j,'田がふえた +25%','good');});}
  if(k==='seifun'){const f=adj(T,i,'hatake');if(f)popAt(i,'田'+f+'つ +'+25*f+'%','good');}
  if(k==='panya'){const h=adj(T,i,'jutaku');if(h)popAt(i,'お客'+h+'軒 +'+25*h+'%','good');}
  if(isHome(k)){popAt(i,noisy(T,i)?'うるさい 10人だけ':'+'+T.grid[i].pop+'人',noisy(T,i)?'bad':'good');
    nb(i).forEach(j=>{if(T.grid[j]&&T.grid[j].k==='panya')popAt(j,'お客がふえた +25%','good');});}
  ev.forEach(e=>popAt(e.i,'うるさい！ −10人','bad'));
  lastPlaced=i;beep(520,.07);dirty=true;save();return true;
}
// 田は1回押すと、押したマスから右と下へ2×2の4マスをまとめて建てる（空いているマスだけ。お金が足りなくなった所で止まる）
// 田を押したとき、実際に田になるマス（押したマスから右と下の2×2のうち、空いている所）
function fieldCells(T,i){const r=Math.floor(i/W),c=i%W,o=[];for(const[dr,dc]of[[0,0],[0,1],[1,0],[1,1]]){const y=r+dr,x=c+dc;if(y>=W||x>=W)continue;const j=y*W+x;if(!T.grid[j]&&terr(T,j)==='.'&&isOpen(T,j))o.push(j);}return o;}
function placeField(i){const T=cur(),r=Math.floor(i/W),c=i%W;let n=0;
  for(const[dr,dc]of[[0,0],[0,1],[1,0],[1,1]]){const y=r+dr,x=c+dc;if(y>=W||x>=W)continue;const j=y*W+x;
    if(T.grid[j]||terr(T,j)!=='.'||!isOpen(T,j))continue;
    if(n>0&&S.money<costOf(T,'hatake'))break;
    if(place(j,'hatake'))n++;else if(n===0)return false;}
  return n>0;}
// 田の上に、ほかの建物をそのまま建てる（田の取り壊しのお金は加わる）
function overwrite(i,k){const T=cur(),c=T.grid[i];if(!c||c.k!=='hatake'||k==='hatake'||!B[k])return false;
  if(!canBuild(T,k)){banner(B[k].n+'は、町が「'+RANK[UNLOCK[k]]+'」になると建てられます');return false;}
  const cost=costOf(T,k),dc=demoCost('hatake'),have=S.money+(isPub(k)&&T.done?Math.max(0,T.yosan||0):0);
  if(have<cost+dc){banner('お金が足りません（田の取り壊し'+dc+'万円＋'+B[k].n+cost+'万円。あと'+Math.ceil(cost+dc-have)+'万円）');beep(170,.15);return false;}
  S.money-=dc;T.grid[i]=null;if(!place(i,k)){T.grid[i]=c;S.money+=dc;return false;}return true;}
function upHouse(i){const T=cur(),c=T.grid[i];if(!c||c.k!=='jutaku'||c.sold||c.sale||c.up)return false;const x=UPG.ie.cost;
  if(S.money<x){S.sure=null;banner('お金が足りません（2階建て'+x+'万円。あと'+Math.ceil(x-S.money)+'万円）');beep(170,.15);dirty=true;return false;}
  S.money-=x;c.up=1;S.sure=null;popAt(i,'2階建て 定員+'+(noisy(T,i)?1:UPG.ie.add)*HN+'人','good');beep(660,.1);dirty=true;save();return true;}
// つながっている、まだ上田でない田（押した田から上下左右にたどる）
function taGroup(T,i){const seen={},out=[],q=[i];seen[i]=1;while(q.length){const j=q.shift(),g=T.grid[j];if(!g||g.k!=='hatake')continue;if(!g.up)out.push(j);const r=Math.floor(j/W),c=j%W;
    for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){const y=r+dr,x=c+dc;if(y<0||x<0||y>=W||x>=W)continue;const k=y*W+x;if(!seen[k]){seen[k]=1;q.push(k);}}}return out;}
function upField(i,all){const T=cur(),c=T.grid[i];if(!c||c.k!=='hatake')return 0;const x=UPG.ta.cost,ls=all?taGroup(T,i):(c.up?[]:[i]),n=Math.min(ls.length,Math.floor(S.money/x));
  if(!ls.length)return 0;if(n<1){S.sure=null;banner('お金が足りません（上田'+x+'万円。あと'+Math.ceil(x-S.money)+'万円）');beep(170,.15);dirty=true;return 0;}
  ls.slice(0,n).forEach(j=>{T.grid[j].up=1;});S.money-=n*x;S.sure=null;popAt(i,n>1?'上田 '+n+'マス ×'+UPG.ta.mul:'上田 ×'+UPG.ta.mul,'good');
  if(n<ls.length)banner('お金が足りる分の '+n+'マスだけ上田にしました');beep(660,.1);dirty=true;save();return n;}
const demoCost=k=>Math.round(B[k].cost*.3);   // 取り壊しにかかるお金（お金は戻らない。洋平さん「現実もそうだし」）
function payPub(T,x){const y=Math.min(Math.max(0,T.yosan||0),x);if(S.money<x-y)return false;T.yosan=(T.yosan||0)-y;S.money-=x-y;return true;}   // 公共の払い：まず共同の資金、足りない分は会社のお金
function pubFund(i){const T=cur(),c=T.grid[i];if(!c||!c.bad)return;const k=KEEP[c.k];
  if(S.money<k){banner('お金が足りません（あと'+Math.ceil(k-S.money)+'万円）');beep(170,.15);return;}
  S.money-=k;c.bad=0;fixCaps(T);banner('会社のお金で維持費を払いました。もとどおり動きます');beep(600,.08);dirty=true;save();}
function pubOff(i){const T=cur(),c=T.grid[i];if(!c||!KEEP[c.k]||c.k==='kouei')return;c.off=true;c.bad=0;S.sure=null;fixCaps(T);banner(B[c.k].n+'を休止しました。維持費はかかりません');dirty=true;save();}
function pubOn(i){const T=cur(),c=T.grid[i];if(!c||!c.off)return;const k=KEEP[c.k];
  if(!payPub(T,k)){banner('再開するお金が足りません（維持費'+k+'万円）');beep(170,.15);return;}
  c.off=false;c.bad=0;fixCaps(T);banner(B[c.k].n+'を再開しました');beep(600,.08);dirty=true;save();}
function sellHouse(i){const T=cur(),c=T.grid[i];if(!c||c.k!=='jutaku'||c.sold||c.sale)return;   // 売りに出す（売れるまで家賃は入る。取り消せる）
  c.sale={t:0,cut:false};S.sure=null;banner('長屋を売りに出しました');beep(520,.08);dirty=true;save();}
function saleCut(i){const c=cur().grid[i];if(!c||!c.sale||c.sale.cut)return;c.sale.cut=true;S.sure=null;banner('2割下げました。売れるまでの時間が半分になります');beep(520,.08);dirty=true;save();}
function saleStop(i){const c=cur().grid[i];if(!c||!c.sale)return;delete c.sale;S.sure=null;banner('売るのを取り消しました');dirty=true;save();}
function demolish(i){const T=cur(),c=T.grid[i];if(!c)return;const dc=demoCost(c.k);
  if(c.sold){S.sure=null;banner('売った家は会社の物ではないので、取り壊せません');beep(170,.15);dirty=true;return;}
  if(lockLeft(T,c)){S.sure=null;banner('共同長屋は、建ててから'+LOCKY+'年は取り壊せません（あと'+lockLeft(T,c)+'年）');beep(170,.15);dirty=true;return;}
  if(isPub(c.k)?!payPub(T,dc):S.money<dc){S.sure=null;banner('取り壊すお金が足りません（'+dc+'万円）');beep(170,.15);dirty=true;return;}
  if(!isPub(c.k))S.money-=dc;T.grid[i]=null;S.sel=null;S.sure=null;fixCaps(T);dirty=true;save();}
function assign(id,i){

function unassign(i){const T=cur(),c=T.grid[i];if(c){c.by=null;const ev=[];fixCaps(T,ev);ev.forEach(e=>popAt(e.i,'うるさい！ −10人','bad'));dirty=true;save();}}
function buyBread(){const T=cur();if(S.money<1500){banner('お金が足りません（あと'+Math.ceil(1500-S.money)+'万円）');return;}

// 時間の進み：SLOW＝実際の1秒に進むゲームの秒数（▶のとき）。見ている間（メニュー・マスの中身）は止める
const SLOW=.5,looking=()=>!!S.dr||(S.sel!=null&&!S.tool);
function tap(i){
  const T=cur(),c=T.grid[i],tool=S.tool,sure0=S.sure;S.sure=null;
  if(!isOpen(T,i)){S.tool=null;S.sel=S.sel===i?null:i;dirty=true;return;}   // まだ買っていない土地：中身の欄に「買う」を出す
  if(tool&&B[tool]){if(c){

function popAt(i,text,cls){   // マスの上に出る短い吹き出し

function banner(t){const b=$('toast');b.firstElementChild.textContent=yenFix(t);b.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{b.hidden=true;},3200);}
function dots(){
  if(S.paused||S.phase!=='town'||document.hidden||!B3D)return;
  const T=cur(),c=calc(T),of=k=>T.grid.map((x,i)=>x&&x.k===k?i:-1).filter(i=>i>=0),pick=a=>a[Math.floor(Math.random()*a.length)];
  const F=of('hatake'),M=of('seifun'),Bk=of('panya'),Hs=T.grid.map((x,i)=>x&&isHome(x.k)?i:-1).filter(i=>i>=0);
  if(c.wheat>0&&F.length&&M.length)dot(pick(F),pick(M),'w');
  if(c.mill>0&&T.flour+T.wheat>0.5&&M.length&&Bk.length)dot(pick(M),pick(Bk),'f');
  if(T.bread>0.5&&Bk.length&&Hs.length)dot(pick(Bk),pick(Hs),'b');
}
function dot(a,b,t){const fx=$('fx'),el=document.createElement('div');el.className='dot d-'+t;   // 運ばれるもの：w もみ／f 玄米／b 白米
  const at=i=>{const p=B3D.xy(i,.14);el.style.left=p[0].toFixed(1)+'px';el.style.top=p[1].toFixed(1)+'px';};
  at(a);fx.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>at(b)));setTimeout(()=>el.remove(),1000);}
let actx=null;
function beep(f,d){if(!S||S.mute)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.06,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

{const dk=$('dock'),tl=()=>dk.querySelector('.tools');let dn=null,moved=false;

document.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el)return;const d=el.dataset;
  if(d.tool){S.tool=S.tool===d.tool?null:d.tool;S.sel=null;S.sure=null;S.hm=false;}
  else if(d.person){const t='p:'+d.person;S.tool=S.tool===t?null:t;S.sel=null;S.sure=null;S.hm=false;}
  else if(d.hm){S.hm=!S.hm;hima();ctx();return;}
  else if(d.sp!=null){const v=+d.sp;if(v===0)S.paused=true;else{S.paused=false;S.speed=v;}}
  else if(d.dr){S.dr=d.dr;S.sure=null;}
  else if(d.leave){if(S.sure==='lv:'+d.leave)leave(d.leave);else S.sure='lv:'+d.leave;}
  else if(d.node!=null){S.mapSel=+d.node;}
  else if(d.go!=null){S.dr='';if(+d.go===S.loc){S.phase='town';}else travel(+d.go);}
  else if(d.found!=null){found(+d.found);}
  else if(d.rg){setRoute(S.mapSel,d.rg,null);}
  else if(d.rt!=null){setRoute(S.mapSel,null,+d.rt);}
  else if(d.ra!=null){setAmt(S.mapSel,+d.ra);}
  else if(d.rl!=null){setRentLv(+d.rl);}
  else if(d.kyo!=null){kyoChoose(+d.kyo);}
  else if(d.act==='tsumi'){tsumiToggle();}
  else if(d.act==='map'){S.dr='';S.phase='map';S.mapSel=S.mapSel==null?S.loc:S.mapSel;S.sure=null;}
  else if(d.act==='buy')buyBread();
  else if(d.act==='plot')buyPlot(blk(S.sel));
  else if(d.act==='clear'){S.tool=null;S.sel=null;S.sure=null;}
  else if(d.act==='drclose'){S.dr='';S.sure=null;}
  else if(d.act==='un')unassign(S.sel);
  else if(d.act==='fund')pubFund(S.sel);
  else if(d.act==='pon')pubOn(S.sel);
  else if(d.act==='poff'){if(S.sure==='poff')pubOff(S.sel);else S.sure='poff';}
  else if(d.act==='sell'){if(S.sure==='sell')sellHouse(S.sel);else S.sure='sell';}
  else if(d.act==='upie'){if(S.sure==='upie')upHouse(S.sel);else S.sure='upie';}
  else if(d.act==='upta')upField(S.sel,false);
  else if(d.act==='uptaall'){if(S.sure==='uptaall')upField(S.sel,true);else S.sure='uptaall';}
  else if(d.act==='salecut')saleCut(S.sel);
  else if(d.act==='salestop')saleStop(S.sel);
  else if(d.act==='demo'){if(S.sure==='demo')demolish(S.sel);else S.sure='demo';}
  else if(d.act==='back'){S.phase='town';S.pick=null;S.sure=null;}
  else if(d.act==='mute'){S.mute=!S.mute;}
  else if(d.act==='reset'){if(S.sure==='reset'){restart();S.dr='';}else S.sure='reset';}
  else return;
  render();save();
});
{const s=$('drawer');let down=null;   // 引き出しの外を押して閉じるのは、押し始めも離したのも外のときだけ（中から外へずらして離しても閉じない）

function start(){
  S=load()||newGame();S.paused=true;S.sure=null;
  S.towns.forEach(T=>{if(T&&!T.open)T.open=Array(16).fill(true);});   // 区画の決まりより前の保存は、全部買ってあることにする
  if(B3D)B3D.setTap(i=>{tap(i);render();save();});
  render();
  setInterval(()=>{if(S.paused||S.phase!=='town'||looking()){return;}const n=Math.ceil(S.speed/3);for(let k=0;k<n&&S.phase==='town';k++)advance(.25*S.speed*SLOW/n,false);if(dirty)render();else hud();},250);   // 速さは 1・3・8倍。8倍は、1回の進みが粗くならないよう3つに分けて進める
  setInterval(dots,1300);
  setInterval(save,3000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
}
