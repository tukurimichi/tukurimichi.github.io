<style>
:root{
  --bg:#0A0A0B; --card:#141416; --card2:#1C1C1F;
  --red:#E31E24; --red-dark:#A8151A;
  --text:#F2F0EC; --muted:#ACA8A2; --line:#2A2A2D;
  --orange:#F0913F; --cream:#E8DCC6;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:420px;margin:0 auto;background:var(--card);min-height:100vh;
  box-shadow:0 0 40px rgba(0,0,0,.5);padding-bottom:28px;}
.backlink{display:inline-block;padding:14px 20px 0;font-size:.85em;color:#FF8A80;text-decoration:none;}
.banner{background:linear-gradient(90deg,var(--red-dark),var(--red));padding:18px 20px;position:relative;}
.banner h1{margin:0;font-size:1.3em;font-weight:900;letter-spacing:.05em;color:#fff;padding-right:78px;}
.banner p{margin:.4em 0 0;font-size:.8em;color:rgba(255,255,255,.85);}
.langToggle{position:absolute;top:17px;right:18px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3);color:#fff;font-size:.72em;font-weight:700;
  padding:6px 12px;border-radius:14px;cursor:pointer;}
.hud{display:flex;gap:8px;padding:12px 16px 8px;}
.hud div{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;}
.hud span{display:block;font-size:.66em;color:var(--muted);letter-spacing:.05em;}
.hud b{display:block;font-size:1.25em;font-family:var(--mono);font-weight:900;margin-top:1px;}
.hud b.flash{color:#FFB13B;}
#stage{display:block;width:100%;height:auto;background:#08080A;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none;}
.ctrl{padding:14px 16px 0;}
.lever{width:100%;padding:16px;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,#C9302C,#8E1B18);color:#fff;font-size:.95em;font-weight:900;
  letter-spacing:.06em;box-shadow:0 3px 0 #5E1210;transition:transform .05s,box-shadow .05s;}
.lever:active{transform:translateY(3px);box-shadow:0 0 0 #5E1210;}
.lever[disabled]{opacity:.4;box-shadow:0 3px 0 #333;}
.gauge{height:8px;background:var(--card2);border:1px solid var(--line);border-radius:5px;
  margin-top:9px;overflow:hidden;}
.gaugeFill{height:100%;width:0%;background:linear-gradient(90deg,#7FCFA0,#FFB13B,#E31E24);}
.hint{font-size:.76em;color:var(--muted);line-height:1.8;padding:12px 18px 0;}
.reset{display:inline-block;margin:12px 18px 0;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-size:.76em;padding:7px 14px;border-radius:9px;cursor:pointer;}
.note{font-size:.72em;color:var(--muted);line-height:1.8;padding:16px 18px 0;border-top:1px solid var(--line);margin-top:18px;}
</style>

<script>
/* ===== 文言 ===== */
var LANG={
ja:{toggleTo:"English",
 title:"玉を弾く | tukurimichi.com",
 desc:"マスコットの玉を弾いて、真ん中の穴に入れる。お金は一切かかりません。",
 t:{backTop:"← トップに戻る",bannerH1:"玉を弾く",bannerP:"真ん中の穴に入ると、絵が回ります。",
  lbBalls:"玉",lbIn:"入賞",lbHit:"当たり",lever:"はじく",reset:"はじめから",
  hint:"押している間、上の矢印が左へ動きます。離すとそこへ玉が落ちます。",
  note:"お金は一切かかりません。買うものも、当たるものもありません。ただ玉が跳ねるだけのものです。"}},
en:{toggleTo:"日本語",
 title:"Flick the Ball | tukurimichi.com",
 desc:"Flick mascot-headed balls and try to drop one into the centre cup. No money involved.",
 t:{backTop:"← Back to top",bannerH1:"Flick the Ball",bannerP:"Land one in the centre cup and the reels spin.",
  lbBalls:"BALLS",lbIn:"CUP",lbHit:"WINS",lever:"FLICK",reset:"Restart",
  hint:"Hold and the arrow at the top slides left. Release to drop the ball there.",
  note:"No money is involved. Nothing to buy, nothing to win. The balls just bounce."}}
};
var lang=localStorage.getItem("lang")||(navigator.language&&navigator.language.indexOf("en")===0?"en":"ja");
function render(l){var L=LANG[l];document.documentElement.lang=l;
 document.getElementById("pageTitle").textContent=L.title;
 document.getElementById("metaDesc").setAttribute("content",L.desc);
 for(var k in L.t){var e=document.getElementById(k);if(e)e.textContent=L.t[k];}
 document.getElementById("langBtn").textContent=L.toggleTo;}
document.getElementById("langBtn").onclick=function(){
 lang=lang==="ja"?"en":"ja";localStorage.setItem("lang",lang);render(lang);};
render(lang);

/* ===== 盤面 ===== */
var W=360,H=620;
var cv=document.getElementById("stage"),cx=cv.getContext("2d");
(function fitDPR(){
 var dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=W+"/"+H;
 cx.setTransform(dpr,0,0,dpr,0,0);
})();

var RAIL_X=332;              // 右のレール。ここより右の盤面には玉を入れない
var RAIL_BALL=347;           // 打ち出した玉が通る溝の中心（レールと台の縁のあいだ）
var PEG_R=3.6, BALL_R=6.4;
// 当たり判定は絵の輪郭を実測して決めた（pachi/mascot.png を1行ずつ走査した値）
// 画像は172x256。中心を(86,128)として、画面上の高さ22pxに縮めた座標
var IMG_W=172, IMG_H=256, IMG_S=22/256;
var PARTS=[{x:0,y:-4.6,r:6.35},          // 頭
           {x:0,y:2.0,r:3.6},{x:0,y:5.2,r:3.4},   // 胴（上下2つ）
           {x:-5.7,y:5.3,r:1.7},{x:5.7,y:5.3,r:1.7},  // 腕
           {x:-2.2,y:8.5,r:1.7},{x:2.2,y:8.5,r:1.7}]; // 脚
var MASS=0,INER=0,RMAX=0;
(function(){for(var i=0;i<PARTS.length;i++){var q=PARTS[i],m=q.r*q.r;
 MASS+=m;INER+=m*(q.r*q.r*0.5+q.x*q.x+q.y*q.y);
 RMAX=Math.max(RMAX,Math.sqrt(q.x*q.x+q.y*q.y)+q.r);}})();
// 絵。読めなければ下の手描きに戻る（真っ白にならないように）
var SPRITE=new Image(), SPRITE_OK=false;
SPRITE.onload=function(){SPRITE_OK=true;};
SPRITE.src="pachi/mascot.png";
var BOARD=new Image(), BOARD_OK=false;
BOARD.onload=function(){BOARD_OK=true;};
BOARD.src="pachi/board.jpg";
// 3Dで焼いた部品。読めなければ下の手描きに戻る
var PART={}, PART_OK={};
["peg","chucker","bezel"].forEach(function(n){
 var im=new Image();
 im.onload=(function(k){return function(){PART_OK[k]=true;};})(n);
 im.src="pachi/parts/"+n+".png"; PART[n]=im;
});
var G=0.40, REST=0.58;
// ここを触ると手ごたえが変わる
var TUNE={jit:0.45, spread:0.25, entryL:56, entryR:300,
          rows:[120,300], sp:42,
          drag:0.972, vmax:3.2,      // 横のブレを抑える。狙いを効かせるための要
          fx:88, fstep:15, fn:6, fy:320, fdy:22};  // 役物の脇からカップへ戻す寄せ釘

// 釘。千鳥に並べる。真ん中のカップへ集まりすぎないよう、下2段は外へ逃がす
var pegs=[];
function layout(){
 pegs.length=0;
 var y,x,row=0,sp=TUNE.sp;
 for(y=TUNE.rows[0];y<=TUNE.rows[1];y+=sp){
   var off=(row%2)?sp/2:0;
   for(x=28+off;x<RAIL_X-14;x+=sp){
     if(Math.abs(x-REEL.x)<REEL.r+14&&Math.abs(y-REEL.y)<REEL.r+14) continue; // 役物の周り
     pegs.push({x:x,y:y});
   }
   row++;
 }
 // カップへ絞る漏斗。上が広く、下がカップの幅に近づく
 for(var i=0;i<TUNE.fn;i++){
  pegs.push({x:TUNE.fx+i*TUNE.fstep, y:TUNE.fy+i*TUNE.fdy});
  pegs.push({x:360-TUNE.fx-i*TUNE.fstep, y:TUNE.fy+i*TUNE.fdy});
 }
 // 役物そのものも障害物。玉は左右に回り込む
 pegs.push({x:REEL.x, y:REEL.y, r:REEL.r+2, big:true});
}

var CUP={x:180,y:466,w:34,h:16};          // 真ん中のカップ（入賞）
var REEL={x:180,y:252,r:52};              // 役物（絵が回るところ）
layout();

function entryX(p){return TUNE.entryR-(TUNE.entryR-TUNE.entryL)*p;}

/* ===== 状態 ===== */
var S={balls:50,inCup:0,hits:0,ball:null,power:0,charging:false,
       spin:null,flash:0,fired:0,sentPlay:false,sentDeep:false};

var SYM=["#F0913F","#B7DCC6","#C6BEE0","#EDE4A6","#E7B8BC","#8FB8E0"];

/* ===== 音（外部ファイルなし） ===== */
var AC=null;
function beep(freq,dur,type,vol){
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"square";o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
 }catch(e){}
}

/* ===== 絵 ===== */
function head(g,x,y,r,col,rot){
 g.save();g.translate(x,y);g.rotate(rot||0);
 g.fillStyle=col;
 g.beginPath();                       // 頭は上が丸く、下がすこし角ばった形
 g.moveTo(-r,r*0.45);
 g.quadraticCurveTo(-r,-r,0,-r);
 g.quadraticCurveTo(r,-r,r,r*0.45);
 g.quadraticCurveTo(r,r*0.9,0,r*0.9);
 g.quadraticCurveTo(-r,r*0.9,-r,r*0.45);
 g.closePath();g.fill();
 g.fillStyle="rgba(0,0,0,.55)";       // 目は彫り込み。口はない
 g.beginPath();g.arc(-r*0.34,-r*0.1,r*0.13,0,7);g.fill();
 g.beginPath();g.arc(r*0.34,-r*0.1,r*0.13,0,7);g.fill();
 g.restore();
}

// 当たり判定と同じ形を描く（ずれていると理不尽に見えるので、同じ配列から描く）
function mascot(g,x,y,rot){
 if(SPRITE_OK){
  g.save();g.translate(x,y);g.rotate(rot);
  g.drawImage(SPRITE,-86*IMG_S,-128*IMG_S,IMG_W*IMG_S,IMG_H*IMG_S);
  g.restore();return;
 }
 g.save();g.translate(x,y);g.rotate(rot);
 g.fillStyle="#D9762F";
 for(var k=3;k<PARTS.length;k++){var q=PARTS[k];
  g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fill();}
 g.fillStyle="#F0913F";
 g.beginPath();g.arc(PARTS[1].x,PARTS[1].y,PARTS[1].r,0,7);g.fill();
 g.beginPath();g.arc(PARTS[2].x,PARTS[2].y,PARTS[2].r,0,7);g.fill();
 var h=PARTS[0];
 g.beginPath();                       // 頭。上が丸く、下がすこし角ばる
 g.moveTo(h.x-h.r,h.y+h.r*0.45);
 g.quadraticCurveTo(h.x-h.r,h.y-h.r,h.x,h.y-h.r);
 g.quadraticCurveTo(h.x+h.r,h.y-h.r,h.x+h.r,h.y+h.r*0.45);
 g.quadraticCurveTo(h.x+h.r,h.y+h.r*0.95,h.x,h.y+h.r*0.95);
 g.quadraticCurveTo(h.x-h.r,h.y+h.r*0.95,h.x-h.r,h.y+h.r*0.45);
 g.closePath();g.fill();
 g.fillStyle="rgba(0,0,0,.6)";        // 目は彫り込み。口はない
 g.beginPath();g.arc(h.x-h.r*0.34,h.y-h.r*0.05,h.r*0.14,0,7);g.fill();
 g.beginPath();g.arc(h.x+h.r*0.34,h.y-h.r*0.05,h.r*0.14,0,7);g.fill();
 g.restore();
}

function draw(){
 cx.clearRect(0,0,W,H);
 // 盤面の地
 if(BOARD_OK){cx.drawImage(BOARD,0,0,W,H);}
 else{cx.fillStyle="#0C0C0E";cx.fillRect(0,0,W,H);}
 // レール（内側に細い金属の線を2本重ねて厚みを出す）
 cx.strokeStyle="rgba(0,0,0,.55)";cx.lineWidth=5;
 cx.beginPath();cx.moveTo(RAIL_X,H);cx.lineTo(RAIL_X,70);
 cx.quadraticCurveTo(RAIL_X,26,RAIL_X-40,26);cx.stroke();
 cx.strokeStyle="rgba(210,214,222,.55)";cx.lineWidth=1.6;
 cx.beginPath();cx.moveTo(RAIL_X,H);cx.lineTo(RAIL_X,70);
 cx.quadraticCurveTo(RAIL_X,26,RAIL_X-40,26);cx.stroke();
 // 溝の外側の縁。ここと上の線のあいだを玉が通る
 cx.strokeStyle="rgba(180,186,196,.38)";cx.lineWidth=1.2;
 cx.beginPath();cx.moveTo(W-2,H);cx.lineTo(W-2,58);
 cx.quadraticCurveTo(W-2,12,W-46,12);cx.stroke();
 // 役物。金属の枠 → 奥の暗がり → 絵柄3つ
 cx.save();
 if(!PART_OK.bezel){
  var rg=cx.createRadialGradient(REEL.x-REEL.r*0.4,REEL.y-REEL.r*0.5,2,REEL.x,REEL.y,REEL.r+9);
  rg.addColorStop(0,"#9AA0AA");rg.addColorStop(0.55,"#5C616B");rg.addColorStop(1,"#23262B");
  cx.fillStyle=rg;
  cx.beginPath();cx.arc(REEL.x,REEL.y,REEL.r+9,0,7);cx.fill();
 }
 if(S.flash>0){
  cx.strokeStyle="rgba(227,30,36,"+(0.35+0.35*Math.sin(S.flash*0.4))+")";
  cx.lineWidth=5;cx.beginPath();cx.arc(REEL.x,REEL.y,REEL.r+6,0,7);cx.stroke();
 }
 cx.fillStyle="#07080A";
 cx.beginPath();cx.arc(REEL.x,REEL.y,REEL.r,0,7);cx.fill();
 cx.save();
 cx.beginPath();cx.arc(REEL.x,REEL.y,REEL.r-2,0,7);cx.clip();
 var syms=S.spin?S.spin.show:[0,1,2];
 for(var i=0;i<3;i++){
  var sx=REEL.x-32+i*32;
  cx.fillStyle="rgba(255,255,255,.05)";
  cx.fillRect(sx-14,REEL.y-REEL.r,28,REEL.r*2);          // 絵柄の帯
  head(cx,sx,REEL.y,13,SYM[syms[i]],0);
 }
 var sh=cx.createLinearGradient(0,REEL.y-REEL.r,0,REEL.y+REEL.r);  // 上下を暗く
 sh.addColorStop(0,"rgba(0,0,0,.8)");sh.addColorStop(0.35,"rgba(0,0,0,0)");
 sh.addColorStop(0.65,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.8)");
 cx.fillStyle=sh;cx.fillRect(REEL.x-REEL.r,REEL.y-REEL.r,REEL.r*2,REEL.r*2);
 cx.restore();
 if(PART_OK.bezel){
  var bw=(REEL.r+9)*2/0.94;           // 絵の中で輪の外側が幅の94%
  cx.drawImage(PART.bezel, REEL.x-bw/2, REEL.y-bw/2, bw, bw);
 }else{
  cx.strokeStyle="rgba(255,255,255,.18)";cx.lineWidth=1.4;
  cx.beginPath();cx.arc(REEL.x,REEL.y,REEL.r,0,7);cx.stroke();
 }
 cx.restore();
 // 釘。落ち影・金属・上のハイライトの3枚重ね
 var PW=PEG_R*2.9;                      // 3Dの釘は玉より一回り大きく写している
 for(var p=0;p<pegs.length;p++){
  if(pegs[p].big) continue;
  var gx=pegs[p].x,gy=pegs[p].y;
  cx.fillStyle="rgba(0,0,0,.5)";
  cx.beginPath();cx.arc(gx+0.9,gy+1.5,PEG_R+0.8,0,7);cx.fill();
  if(PART_OK.peg){ cx.drawImage(PART.peg,gx-PW/2,gy-PW/2,PW,PW); }
  else{
   var gr=cx.createRadialGradient(gx-1.1,gy-1.3,0.4,gx,gy,PEG_R+0.4);
   gr.addColorStop(0,"#F2F4F7");gr.addColorStop(0.45,"#AFB4BC");gr.addColorStop(1,"#5A5F68");
   cx.fillStyle=gr;cx.beginPath();cx.arc(gx,gy,PEG_R,0,7);cx.fill();
  }
 }
 // チャッカー。3Dの絵の「口」がカップの矩形にちょうど重なるように置く
 var cl=CUP.x-CUP.w/2;
 if(PART_OK.chucker){
  var cw=CUP.w/0.62;                  // 絵の横幅のうち、口の部分が62%
  var ch=cw*190/320;
  cx.drawImage(PART.chucker, CUP.x-cw/2, CUP.y-ch*0.272, cw, ch);
 }else{
  var cg=cx.createLinearGradient(0,CUP.y,0,CUP.y+CUP.h);
  cg.addColorStop(0,"#000");cg.addColorStop(1,"#14161A");
  cx.fillStyle=cg;cx.fillRect(cl,CUP.y,CUP.w,CUP.h);
  cx.strokeStyle="rgba(210,214,222,.75)";cx.lineWidth=2.2;
  cx.beginPath();cx.moveTo(cl-5,CUP.y-4);cx.lineTo(cl,CUP.y+CUP.h);
  cx.moveTo(cl+CUP.w+5,CUP.y-4);cx.lineTo(cl+CUP.w,CUP.y+CUP.h);cx.stroke();
 }
 var og=cx.createLinearGradient(0,CUP.y,0,CUP.y+6);
 og.addColorStop(0,"rgba(240,145,63,.8)");og.addColorStop(1,"rgba(240,145,63,0)");
 cx.fillStyle=og;cx.fillRect(cl,CUP.y,CUP.w,6);
 // 下は暗く落として、抜けた玉が消えるように見せる
 var bg2=cx.createLinearGradient(0,540,0,H);
 bg2.addColorStop(0,"rgba(0,0,0,0)");bg2.addColorStop(1,"rgba(0,0,0,.85)");
 cx.fillStyle=bg2;cx.fillRect(0,540,W,H-540);
 // 狙い（押している間だけ出る）
 if(S.charging){
  var ax=entryX(S.power);
  cx.fillStyle="rgba(227,30,36,.85)";
  cx.beginPath();cx.moveTo(ax,20);cx.lineTo(ax-6,8);cx.lineTo(ax+6,8);cx.closePath();cx.fill();
  cx.strokeStyle="rgba(227,30,36,.28)";cx.lineWidth=1;cx.setLineDash([4,6]);
  cx.beginPath();cx.moveTo(ax,22);cx.lineTo(ax,H);cx.stroke();cx.setLineDash([]);
 }
 // 玉
 if(S.ball) mascot(cx,S.ball.x,S.ball.y,S.ball.rot);
}

/* ===== 物理 ===== */
// 当たった一点で押し戻して、その位置に応じた回転を与える
function hit(b,px,py,nx,ny,pen,jit){
 b.x+=nx*pen; b.y+=ny*pen;
 var rx=px-b.x, ry=py-b.y;
 var vx=b.vx-b.om*ry, vy=b.vy+b.om*rx;      // 接触点の速さ（回転ぶんを足す）
 var vn=vx*nx+vy*ny;
 if(vn>=0) return;                            // 離れていく向きなら何もしない
 var rn=rx*ny-ry*nx;
 var j=-(1+REST)*vn/(1/MASS+rn*rn/INER);
 b.vx+=j*nx/MASS; b.vy+=j*ny/MASS; b.om+=rn*j/INER;
 // 摩擦。これがないと転がらず、滑るだけになる
 var tx=-ny,ty=nx, vt=vx*tx+vy*ty, rt=rx*ty-ry*tx;
 var jt=-vt/(1/MASS+rt*rt/INER);
 var lim=0.42*Math.abs(j);
 if(jt> lim)jt= lim; if(jt<-lim)jt=-lim;
 b.vx+=jt*tx/MASS; b.vy+=jt*ty/MASS; b.om+=rt*jt/INER;
 if(jit){ b.vx+=(Math.random()-0.5)*jit; b.om+=(Math.random()-0.5)*jit*0.05; }
}

function step(){
 var b=S.ball;if(!b)return;
 if(b.rail){                                  // レールを駆け上がる
  b.t+=0.055;
  var t=b.t;
  if(t>=1){b.rail=false;b.x=entryX(b.power);b.y=44;
           b.vx=(Math.random()-0.5)*TUNE.spread*2;b.vy=0.4;
           b.om=(Math.random()-0.5)*0.12;}
  else if(t>0.62){var u=(t-0.62)/0.38;      // 上を左へ転がって、狙った位置で落ちる
           var sx=RAIL_BALL, ex=entryX(b.power);
           b.x=sx+(ex-sx)*u;
           b.y=26+Math.sin(u*Math.PI)*-6;}  // てっぺんをすこし膨らませる
  else{b.x=RAIL_BALL;b.y=580-(580-26)*(t/0.62);}
  b.rot+=0.22;return;
 }
 b.vy+=G;
 b.vx*=TUNE.drag;                                   // 横だけ減衰させる
 if(b.vx> TUNE.vmax)b.vx= TUNE.vmax;
 if(b.vx<-TUNE.vmax)b.vx=-TUNE.vmax;
 b.om*=0.985;
 if(b.om> 0.34)b.om= 0.34;
 if(b.om<-0.34)b.om=-0.34;
 b.x+=b.vx;b.y+=b.vy;b.rot+=b.om;

 var co=Math.cos(b.rot),si=Math.sin(b.rot),i,k;
 // 手足の1つずつを釘・壁とぶつける
 for(k=0;k<PARTS.length;k++){
  var q=PARTS[k];
  var px=b.x+co*q.x-si*q.y, py=b.y+si*q.x+co*q.y;
  // 壁
  if(px-q.r<0)      hit(b,px,py,1,0,q.r-px,0.5);
  if(px+q.r>RAIL_X) hit(b,px,py,-1,0,px+q.r-RAIL_X,0.5);
  // 釘
  for(i=0;i<pegs.length;i++){
   var dx=px-pegs[i].x,dy=py-pegs[i].y,rr=q.r+(pegs[i].r||PEG_R);
   if(dx*dx+dy*dy<rr*rr){
    var d=Math.sqrt(dx*dx+dy*dy)||0.001;
    hit(b,px,py,dx/d,dy/d,rr-d,TUNE.jit);
    beep(1100+Math.random()*600,0.03,"square",0.03);
   }
  }
 }
 // 釘の上で止まってしまったとき。放っておくと盤面が固まるので逃がす
 b.age=(b.age||0)+1;
 if(b.age>560){ S.ball=null; update(); return; }      // 9秒以上かかったら1発ぶん諦める
 if(b.vx*b.vx+b.vy*b.vy<0.55&&Math.abs(b.om)<0.06){ b.slow=(b.slow||0)+1; } else { b.slow=0; }
 if(b.slow>36){
  b.slow=0; b.nudge=(b.nudge||0)+1;
  b.vx+=(Math.random()-0.5)*2.6; b.vy=1.3; b.om+=(Math.random()-0.5)*0.3;
  if(b.nudge>3){ S.ball=null; update(); return; }   // それでも駄目なら1発ぶん諦める
 }
 // カップ判定
 if(b.y+6>CUP.y&&b.y<CUP.y+CUP.h+6&&Math.abs(b.x-CUP.x)<CUP.w/2&&b.vy>0){
  S.ball=null;S.inCup++;S.balls+=1;spin();update();return;
 }
 if(b.y>H+30){S.ball=null;update();}
}

/* ===== 役物 ===== */
function spin(){
 beep(880,0.08,"triangle",0.06);
 var win=Math.random()<0.125;
 var goal=win?[0,0,0]:[1,3,5];
 if(win){var s=Math.floor(Math.random()*SYM.length);goal=[s,s,s];}
 else{ // わざと揃わない並び
  var a=Math.floor(Math.random()*6),b2=(a+1+Math.floor(Math.random()*4))%6,c=(b2+1+Math.floor(Math.random()*4))%6;
  if(a===c)c=(c+1)%6;goal=[a,b2,c];
 }
 S.spin={show:[0,0,0],goal:goal,t:0,win:win,locked:0};
}
function spinStep(){
 var s=S.spin;if(!s)return;
 s.t++;
 for(var i=0;i<3;i++){
  if(i<s.locked) continue;
  s.show[i]=Math.floor(Math.random()*SYM.length);
 }
 if(s.t===26||s.t===40||s.t===56){
  s.show[s.locked]=s.goal[s.locked];s.locked++;
  beep(s.locked===3&&s.win?1320:660,0.06,"triangle",0.05);
 }
 if(s.locked>=3){
  if(s.win){
   S.hits++;S.balls+=12;S.flash=70;
   gtag("event","pachinko_hit",{balls_used:S.fired});
   for(var k=0;k<4;k++)(function(k){setTimeout(function(){beep(660+k*220,0.12,"triangle",0.06);},k*90);})(k);
  }
  S.spin=null;update();
 }
}

/* ===== 操作 ===== */
var lever=document.getElementById("lever"),gauge=document.getElementById("gauge");
function charge(){
 if(S.charging){S.power=Math.min(1,S.power+0.028);gauge.style.width=(S.power*100)+"%";}
}
function fire(){
 if(!S.charging)return;
 S.charging=false;
 if(S.ball||S.balls<=0){S.power=0;gauge.style.width="0%";return;}
 S.balls--;S.fired++;
 S.ball={x:RAIL_X,y:580,vx:0,vy:0,om:0,rot:0,rail:true,t:0,power:S.power};
 beep(300,0.06,"sawtooth",0.05);
 if(!S.sentPlay){S.sentPlay=true;gtag("event","pachinko_play",{});}
 if(S.fired>=100&&!S.sentDeep){S.sentDeep=true;gtag("event","pachinko_deep",{launches:S.fired});}
 S.power=0;gauge.style.width="0%";update();
}
function down(e){e.preventDefault();S.charging=true;S.power=0;}
lever.addEventListener("mousedown",down);
lever.addEventListener("touchstart",down,{passive:false});
window.addEventListener("mouseup",fire);
window.addEventListener("touchend",fire);
document.getElementById("reset").onclick=function(){
 S.balls=50;S.inCup=0;S.hits=0;S.ball=null;S.spin=null;S.fired=0;S.flash=0;update();
};

function update(){
 document.getElementById("vBalls").textContent=S.balls;
 document.getElementById("vIn").textContent=S.inCup;
 var h=document.getElementById("vHit");
 h.textContent=S.hits;h.className=S.hits>0?"flash":"";
 lever.disabled=(S.balls<=0);
}

/* ===== ループ ===== */
var acc=0,last=0;
function loop(ts){
 if(!last)last=ts;
 acc+=Math.min(ts-last,80);last=ts;
 while(acc>=16.7){charge();step();spinStep();if(S.flash>0)S.flash--;acc-=16.7;}
 draw();
 requestAnimationFrame(loop);
}
update();
requestAnimationFrame(loop);
</script>
</body>
